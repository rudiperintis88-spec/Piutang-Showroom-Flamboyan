otdue\",\"d7\",\"d14\",\"d26\",\"over\"];\n\nfunction parseDate(s) {\n  if (!s) return null;\n  const m = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(s);\n  if (!m) return null;\n  return new Date(+m[1], +m[2]-1, +m[3]);\n}\n\nconst today = new Date();\ntoday.setHours(0,0,0,0);\n\nfunction computeHari(tglJto) {\n  const d = parseDate(tglJto);\n  if (!d) return null;\n  return Math.round((today - d) / 86400000);\n}\n\nconst NO_TAGIH_MARKERS = [\"belum buat tagihan\", \"-\", \"\"];\nfunction categorize(row) {\n  const raw = (row.tglTagih || \"\").toString().trim().toLowerCase();\n  const hasTagih = raw !== \"\" && !NO_TAGIH_MARKERS.includes(raw);\n  const hari = computeHari(row.tglJto);\n  if (!hasTagih) return \"belum\";\n  if (hari === null) return \"notdue\";\n  if (hari < 1) return \"notdue\";\n  if (hari <= 7) return \"d7\";\n  if (hari <= 14) return \"d14\";\n  if (hari <= 26) return \"d26\";\n  return \"over\";\n}\n\nlet rows = RAW.map(r => ({...r, hari: computeHari(r.tglJto), cat: categorize(r)}));\n\nfunction sortGroup(list) {\n  return list.sort((a, b) => {\n    const l = (a.leasing || \"\").localeCompare(b.leasing || \"\");\n    if (l !== 0) return l;\n    return (b.hari ?? -999) - (a.hari ?? -999);\n  });\n}\n\nfunction fmtMoney(n) { return Math.round(n).toLocaleString('id-ID'); }\nfunction fmtDateShort(s) {\n  const d = parseDate(s);\n  if (!d) return s || \"\\u2013\";\n  const dd = String(d.getDate()).padStart(2, '0');\n  const mm = String(d.getMonth() + 1).padStart(2, '0');\n  return `${dd}/${mm}/${d.getFullYear()}`;\n}\n\n\nlet activeFilter = \"all\";\nlet searchTerm = \"\";\n\nfunction buildPills() {\n  const el = document.getElementById('pills');\n  const counts = {};\n  const totals = {};\n  CAT_ORDER.forEach(c => { counts[c]=0; totals[c]=0; });\n  rows.forEach(r => { counts[r.cat]++; totals[r.cat]+=Number(r.jumlah)||0; });\n\n  const allTotal = rows.reduce((s,r)=>s+(Number(r.jumlah)||0),0);\n  let html = `<div class=\"pill ${activeFilter==='all'?'active':''}\" data-cat=\"all\">\n      <span class=\"dot\" style=\"background:var(--ink)\"><\/span>\n      Semua <span class=\"cnt\">${rows.length}<\/span>\n    <\/div>`;\n  CAT_ORDER.forEach(c => {\n    if (counts[c] === 0 && c === 'notdue') return; // hide empty \"belum jatuh tempo\" bucket most of the time\n    html += `<div class=\"pill ${activeFilter===c?'active':''}\" data-cat=\"${c}\">\n        <span class=\"dot\" style=\"background:${CATS[c].color}\"><\/span>\n        ${CATS[c].label} <span class=\"cnt\">${counts[c]}<\/span>\n      <\/div>`;\n  });\n  el.innerHTML = html;\n  el.querySelectorAll('.pill').forEach(p => {\n    p.addEventListener('click', () => {\n      activeFilter = p.dataset.cat;\n      render();\n    });\n  });\n\n  // hero stats\n  document.getElementById('totalAmount').textContent = fmtMoney(allTotal);\n  document.getElementById('totalCount').textContent = rows.length;\n  document.getElementById('overCount').textContent = counts.over;\n  document.getElementById('within7Count').textContent = counts.d7;\n\n  // composition bar\n  const comp = document.getElementById('composition');\n  comp.innerHTML = \"\";\n  CAT_ORDER.forEach(c => {\n    if (!totals[c]) return;\n    const pct = (totals[c]/allTotal*100).toFixed(2);\n    const span = document.createElement('span');\n    span.style.width = pct + \"%\";\n    span.style.background = CATS[c].color;\n    span.title = CATS[c].label + \": \" + pct + \"%\";\n    comp.appendChild(span);\n  });\n}\n\nfunction matchesSearch(r) {\n  if (!searchTerm) return true;\n  const hay = (r.nama + \" \" + r.faktur + \" \" + r.salesman + \" \" + r.noCust).toLowerCase();\n  return hay.includes(searchTerm);\n}\n\nfunction render() {\n  buildPills();\n  const tbody = document.getElementById('tbody');\n  tbody.innerHTML = \"\";\n\n  let visible = rows.filter(matchesSearch);\n  if (activeFilter !== \"all\") visible = visible.filter(r => r.cat === activeFilter);\n\n  document.getElementById('resultCount').textContent = visible.length + \" dari \" + rows.length + \" baris\";\n  document.getElementById('emptyState').style.display = visible.length ? \"none\" : \"block\";\n\n  if (activeFilter === \"all\") {\n    CAT_ORDER.forEach(c => {\n      const group = sortGroup(visible.filter(r => r.cat === c));\n      if (!group.length) return;\n      const groupTotal = group.reduce((s,r)=>s+(Number(r.jumlah)||0),0);\n      const gh = document.createElement('tr');\n      gh.className = 'grouphead';\n      gh.innerHTML = `<td colspan=\"9\">\n          <span class=\"swatch\" style=\"background:${CATS[c].color}\"><\/span>${CATS[c].label}\n          <span class=\"ghcount\">${group.length} debitur<\/span>\n          <span class=\"ghtotal\">Rp ${fmtMoney(groupTotal)}<\/span>\n        <\/td>`;\n      tbody.appendChild(gh);\n      group.forEach(r => tbody.appendChild(renderRow(r)));\n    });\n  } else {\n    sortGroup(visible).forEach(r => tbody.appendChild(renderRow(r)));\n  }\n}\n\nfunction renderRow(r) {\n  const tr = document.createElement('tr');\n  tr.className = 'rowcat';\n  tr.style.borderLeftColor = CATS[r.cat].color;\n  tr.innerHTML = `\n    <td class=\"nama\">${r.nama}<\/td>\n    <td>${r.faktur}<\/td>\n    <td>${r.type||\"\"}<\/td>\n    <td>${fmtDateShort(r.tglJto)}<\/td>\n    <td class=\"num money\">${fmtMoney(r.jumlah)}<\/td>\n    <td>${r.leasing}<\/td>\n    <td>${r.salesman||\"\\u2013\"}<\/td>\n    <td>${r.supervisor||\"\\u2013\"}<\/td>\n    <td class=\"num hari\">${r.hari===null?\"\\u2013\":r.hari}<\/td>`;\n  return tr;\n}\n\ndocument.getElementById('search').addEventListener('input', (e) => {\n  searchTerm = e.target.value.trim().toLowerCase();\n  render();\n});\n\n/* ---------- Tab: Per Leasing ---------- */\nconst BUCKET_KEYS = [\"belum\", \"d7\", \"d14\", \"d26\", \"over\"];\n\nfunction groupByLeasing(list) {\n  const map = new Map();\n  list.forEach(r => {\n    const key = r.leasing || \"Lainnya\";\n    if (!map.has(key)) map.set(key, []);\n    map.get(key).push(r);\n  });\n  return [...map.entries()]\n    .map(([leasing, items]) => ({\n      leasing,\n      items: sortGroup(items.slice()),\n      total: items.reduce((s,r)=>s+(Number(r.jumlah)||0), 0),\n      bucketTotals: BUCKET_KEYS.reduce((acc,k) => {\n        acc[k] = items.filter(r=>r.cat===k).reduce((s,r)=>s+(Number(r.jumlah)||0), 0);\n        return acc;\n      }, {}),\n    }))\n    .sort((a,b) => b.total - a.total);\n}\n\nfunction renderLeasingTab() {\n  const groups = groupByLeasing(rows);\n\n  const tbody = document.getElementById('matrixBody');\n  tbody.innerHTML = \"\";\n  let grand = { count:0, belum:0, d7:0, d14:0, d26:0, over:0, total:0 };\n  const cell = (v) => v ? `Rp ${fmtMoney(v)}` : `<span class=\"zero\">&ndash;<\/span>`;\n  groups.forEach(g => {\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      <td class=\"leasing-name\">${g.leasing}<\/td>\n      <td>${g.items.length}<\/td>\n      <td>${cell(g.bucketTotals.belum)}<\/td>\n      <td>${cell(g.bucketTotals.d7)}<\/td>\n      <td>${cell(g.bucketTotals.d14)}<\/td>\n      <td>${cell(g.bucketTotals.d26)}<\/td>\n      <td>${cell(g.bucketTotals.over)}<\/td>\n      <td><strong>Rp ${fmtMoney(g.total)}<\/strong><\/td>`;\n    tbody.appendChild(tr);\n    grand.count += g.items.length;\n    grand.belum += g.bucketTotals.belum; grand.d7 += g.bucketTotals.d7;\n    grand.d14 += g.bucketTotals.d14; grand.d26 += g.bucketTotals.d26; grand.over += g.bucketTotals.over;\n    grand.total += g.total;\n  });\n  const gr = document.createElement('tr');\n  gr.className = 'grand';\n  gr.innerHTML = `\n    <td class=\"leasing-name\">Total Flamboyan<\/td>\n    <td>${grand.count}<\/td>\n    <td>Rp ${fmtMoney(grand.belum)}<\/td>\n    <td>Rp ${fmtMoney(grand.d7)}<\/td>\n    <td>Rp ${fmtMoney(grand.d14)}<\/td>\n    <td>Rp ${fmtMoney(grand.d26)}<\/td>\n    <td>Rp ${fmtMoney(grand.over)}<\/td>\n    <td>Rp ${fmtMoney(grand.total)}<\/td>`;\n  tbody.appendChild(gr);\n\n  const el = document.getElementById('leasingSections');\n  el.innerHTML = \"\";\n  groups.forEach(g => {\n    const section = document.createElement('div');\n    section.className = 'leasing-section';\n    section.innerHTML = `\n      <div class=\"leasing-head\">\n        <span class=\"name\">${g.leasing}<\/span>\n        <span class=\"meta\">${g.items.length} debitur &middot; Rp ${fmtMoney(g.total)}<\/span>\n      <\/div>\n      <div class=\"leasing-table-scroll\">\n        <table class=\"detail\">\n          <thead>\n            <tr>\n              <th>Nama Debitur<\/th>\n              <th>Faktur No.<\/th>\n              <th>Tipe Unit<\/th>\n              <th>Jth. Tempo<\/th>\n              <th class=\"num\">Jumlah<\/th>\n              <th>Cara Bayar<\/th>\n              <th>Salesman<\/th>\n              <th>Supervisor<\/th>\n              <th class=\"num\">Hari<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody><\/tbody>\n        <\/table>\n      <\/div>`;\n    const tb = section.querySelector('tbody');\n    g.items.forEach(r => {\n      const tr = document.createElement('tr');\n      tr.className = 'rowcat';\n      tr.style.borderLeftColor = CATS[r.cat] ? CATS[r.cat].color : 'transparent';\n      tr.innerHTML = `\n        <td class=\"nama\">${r.nama}<\/td>\n        <td>${r.faktur}<\/td>\n        <td>${r.type||\"\"}<\/td>\n        <td>${fmtDateShort(r.tglJto)}<\/td>\n        <td class=\"money\">${fmtMoney(r.jumlah)}<\/td>\n        <td>${r.cara||\"\\u2013\"}<\/td>\n        <td>${r.salesman||\"\\u2013\"}<\/td>\n        <td>${r.supervisor||\"\\u2013\"}<\/td>\n        <td class=\"hari\">${r.hari===null?\"\\u2013\":r.hari}<\/td>`;\n      tb.appendChild(tr);\n    });\n    el.appendChild(section);\n  });\n}\n\n/* ---------- Tab switching ---------- */\ndocument.querySelectorAll('.tab').forEach(btn => {\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    const target = btn.dataset.tab;\n    document.getElementById('tabpanel-umur').hidden = target !== 'umur';\n    document.getElementById('tabpanel-leasing').hidden = target !== 'leasing';\n    document.getElementById('tabpanel-followup').hidden = target !== 'followup';\n    document.getElementById('tabpanel-penjualanleasing').hidden = target !== 'penjualanleasing';\n    document.getElementById('tabpanel-penjualanasuransi').hidden = target !== 'penjualanasuransi';\n    document.getElementById('tabpanel-penjualansupervisor').hidden = target !== 'penjualansupervisor';\n    document.getElementById('tabpanel-salesterbanyak').hidden = target !== 'salesterbanyak';\n    document.getElementById('tabpanel-detailpenjualan').hidden = target !== 'detailpenjualan';\n  });\n});\n\nfunction hasTagihValue(r) {\n  const raw = (r.tglTagih || \"\").toString().trim().toLowerCase();\n  return raw !== \"\" && !NO_TAGIH_MARKERS.includes(raw);\n}\n\nlet followupSearchTerm = \"\";\nlet followupLeasingValue = \"\";\nlet followupStatus = \"all\";\nlet followupSortKey = \"leasing\";\nlet followupSortDir = \"asc\";\n\nfunction populateLeasingFilter() {\n  const sel = document.getElementById('followupLeasingFilter');\n  const current = sel.value;\n  const leasings = [...new Set(rows.map(r => r.leasing || \"-\"))].sort((a, b) => a.localeCompare(b));\n  sel.innerHTML = '<option value=\"\">Semua leasing<\/option>' +\n    leasings.map(l => `<option value=\"${l}\">${l}<\/option>`).join('');\n  if (leasings.includes(current)) sel.value = current;\n}\n\nfunction sortVal(r, key) {\n  switch (key) {\n    case 'no': return 0;\n    case 'jumlah': return Number(r.jumlah) || 0;\n    case 'hari': return r.hari ?? -9999;\n    case 'tglJto': case 'tglTagih': case 'tglBarcode': {\n      const d = parseDate(r[key]);\n      return d ? d.getTime() : -Infinity;\n    }\n    default: return (r[key] || \"\").toString().toLowerCase();\n  }\n}\n\nfunction renderFollowupTab() {\n  populateLeasingFilter();\n  const tbody = document.getElementById('followupBody');\n  tbody.innerHTML = \"\";\n  pfShowNote();\n\n  let list = rows.filter(r => {\n    if (followupLeasingValue && (r.leasing || \"-\") !== followupLeasingValue) return false;\n    const sudah = hasTagihValue(r);\n    if (followupStatus === 'sudah' && !sudah) return false;\n    if (followupStatus === 'belum' && sudah) return false;\n    if (followupSearchTerm) {\n      const hay = (r.nama + \" \" + r.faktur + \" \" + r.salesman + \" \" + r.noCust).toLowerCase();\n      if (!hay.includes(followupSearchTerm)) return false;\n    }\n    return true;\n  });\n\n  list.sort((a, b) => {\n    const va = sortVal(a, followupSortKey), vb = sortVal(b, followupSortKey);\n    let cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;\n    if (followupSortKey === 'leasing' && cmp === 0) cmp = (b.hari ?? -999) - (a.hari ?? -999);\n    return followupSortDir === 'asc' ? cmp : -cmp;\n  });\n\n  list.forEach((r, idx) => {\n    const tr = document.createElement('tr');\n    tr.className = 'rowcat';\n    tr.style.borderLeftColor = CATS[r.cat] ? CATS[r.cat].color : 'transparent';\n    const sudah = hasTagihValue(r);\n    const badge = sudah\n      ? `<span class=\"badge badge-sudah\">Sudah<\/span>${fmtDateShort(r.tglTagih)}`\n      : `<span class=\"badge badge-belum\">Belum<\/span>`;\n    tr.innerHTML = `\n      <td class=\"num\">${idx + 1}<\/td>\n      <td class=\"nama\">${r.nama}<\/td>\n      <td>${fmtDateShort(r.tglJto)}<\/td>\n      <td>${r.leasing}<\/td>\n      <td>${TARGET_DIVISI}<\/td>\n      <td class=\"num money\">${fmtMoney(r.jumlah)}<\/td>\n      <td>${badge}<\/td>\n      <td class=\"num hari\">${r.hari===null?\"\\u2013\":r.hari}<\/td>\n      <td>${r.salesman||\"\\u2013\"}<\/td>\n      <td>${r.supervisor||\"\\u2013\"}<\/td>\n      <td>${r.faktur}<\/td>\n      <td>${fmtDateShort(r.tglBarcode)}<\/td>`;\n    tbody.appendChild(tr);\n  });\n\n  document.querySelectorAll('#followupTable th[data-key]').forEach(th => {\n    th.classList.toggle('sorted', th.dataset.key === followupSortKey);\n    th.querySelector('.arro  {};\n  const out = { nama: a.nama || b.nama || '', jumlah: a.jumlah || b.jumlah || 0, leasing: a.leasing || b.leasing || '', jto: a.jto || b.jto || '' };\n  out.delAt = [a.delAt, b.delAt].filter(Boolean).sort().pop() || null;             // hapus-riwayat: yang terbaru menang\n  const pick = (b.lu || '') > (a.lu || '') ? b : a;                                  // status lunas: perubahan terbaru menang\n  out.lunasAt = pick.lunasAt || null; out.lu = pick.lu || null;\n  const notes = {};                                                                  // catatan: gabungan semua perangkat (hanya bertambah)\n  [a, b].forEach(r => (r.notes || []).forEach(n => { const id = n.id || ('L' + (n.t || '') + '|' + n.x); notes[id] = Object.assign({}, n, { id: id }); }));\n  out.notes = Object.keys(notes).map(k => notes[k]).filter(n => !out.delAt || (n.t && n.t > out.delAt))\n    .sort((p, q) => String(p.t || '').localeCompare(String(q.t || '')));\n  const tasks = {};                                                                  // tugas: versi dengan waktu ubah terbaru menang\n  [a, b].forEach(r => (r.tasks || []).forEach(t => { const p = tasks[t.id]; if (!p || (t.u || t.t || '') > (p.u || p.t || '')) tasks[t.id] = t; }));\n  out.tasks = Object.keys(tasks).map(k => tasks[k]).filter(t => !out.delAt || (t.t && t.t > out.delAt));\n  return out;\n}\nconst FU_KEY = 'follow_piutang_v1_' + TARGET_DIVISI;   // dipisah per divisi\nconst OLD_CAT = 'catatan_piutang_';\nlet fuDB = {};\ntry { fuDB = JSON.parse(localStorage.getItem(FU_KEY) || '{}') || {}; } catch (e) { fuDB = {}; }\ntry { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}\nfunction fuSaveLocal() { try { localStorage.setItem(FU_KEY, JSON.stringify(fuDB)); } catch (e) {} }\nfunction fuSave() {\n  fuSaveLocal();\n  if (SYNC_URL) { fuPending = true; clearTimeout(fuTimer); fuTimer = setTimeout(fuSyncRemote, 1200); }\n}\nconst fuOpen = new Set();\nlet fuLive = false;\nconst fuNow = () => new Date().toISOString();\nfunction fuFmt(iso) {\n  if (!iso) return 'Catatan lama';\n  const d = new Date(iso), p = n => String(n).padStart(2, '0');\n  const mon = [\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"Mei\",\"Jun\",\"Jul\",\"Agu\",\"Sep\",\"Okt\",\"Nov\",\"Des\"][d.getMonth()];\n  return `${d.getDate()} ${mon}${d.getFullYear() !== today.getFullYear() ? ' ' + d.getFullYear() : ''} ${p(d.getHours())}.${p(d.getMinutes())}`;\n}\nfunction fuRec(r, create) {\n  let x = fuDB[r.faktur];\n  if (!x) {\n    let old = ''; try { old = localStorage.getItem(OLD_CAT + r.faktur) || ''; } catch (e) {}\n    if (!create && !old) return null;\n    x = fuDB[r.faktur] = { notes: old ? [{ id: 'old:' + r.faktur, t: null, x: old }] : [], tasks: [], lunasAt: null };\n  }\n  x.nama = r.nama; x.jumlah = r.jumlah; x.leasing = r.leasing; x.jto = r.tglJto;\n  return x;\n}\n// Faktur yang punya riwayat lalu hilang dari Sheet1 (data live berhasil dimuat) = dianggap lunas -> diarsipkan\nfunction fuSyncLunas() {\n  if (!fuLive) return;\n  const cur = new Set(rows.map(r => r.faktur));\n  let ch = false;\n  Object.entries(fuDB).forEach(([f, x]) => {\n    if (!cur.has(f) && !x.lunasAt && !x.delAt) { x.lunasAt = fuNow(); x.lu = x.lunasAt; ch = true; }\n    else if (cur.has(f) && x.lunasAt) { x.lunasAt = null; x.lu = fuNow(); ch = true; }\n  });\n  if (ch) fuSave();\n}\nconst fuNotes = x => (x.notes || []).slice().reverse().map(n => `<li><small>${fuFmt(n.t)}<\/small><div>${esc(n.x)}<\/div><\/li>`).join('') || '<li class=\"z\">Belum ada catatan.<\/li>';\n\nfunction fuDetail(r) {\n  const x = fuRec(r, false) || { notes: [], tasks: [] }, f = esc(r.faktur);\n  const tasks = x.tasks.filter(t => !t.del).map(t => `<li class=\"${t.done ? 'done' : ''}\"><label><input type=\"checkbox\" data-a=\"tg\" data-f=\"${f}\" data-i=\"${t.id}\" ${t.done ? 'checked' : ''}> <span>${esc(t.x)}<\/span><\/label><button class=\"fu-x\" title=\"Hapus tugas\" data-a=\"td\" data-f=\"${f}\" data-i=\"${t.id}\">&times;<\/button><div><small>PIC: ${esc(t.pic || '-')}${t.done && t.doneAt ? ' &middot; selesai ' + fuFmt(t.doneAt) : ''}<\/small><\/div><\/li>`).join('') || '<li class=\"z\">Belum ada tugas.<\/li>';\n  const pic = esc((r.salesman || '').split(' ')[0]);\n  return `<div class=\"pr-grid\">\n    <div><h4>CATATAN &mdash; ${f}<\/h4><ul class=\"fu-list\">${fuNotes(x)}<\/ul>\n      <div class=\"fu-form\"><textarea class=\"fu-in\" data-k=\"note\" rows=\"2\" placeholder=\"Tulis catatan follow-up...\"><\/textarea><button class=\"fu-btn\" data-a=\"note\" data-f=\"${f}\">Kirim<\/button><\/div><\/div>\n    <div><h4>TUGAS TERKAIT FAKTUR INI<\/h4><ul class=\"fu-list\">${tasks}<\/ul>\n      <div class=\"fu-form\"><input class=\"fu-in\" data-k=\"task\" placeholder=\"Tugas... (mis. telepon debitur)\"><input class=\"fu-in pic\" data-k=\"pic\" value=\"${pic}\" title=\"PIC\"><button class=\"fu-btn\" data-a=\"task\" data-f=\"${f}\">+ Tugas<\/button><\/div><\/div>\n  <\/div>`;\n}\n\n/* ---------- Sinkron catatan & tugas ke server (Google Apps Script) ---------- */\nlet fuPending = SYNC_URL ? true : false, fuSyncing = false, fuTimer = null, fuSyncState = SYNC_URL ? 'busy' : 'off', fuLastOk = null;\nconst fuUid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);\nfunction fuNormalize() {\n  Object.values(fuDB).forEach(x => {\n    x.notes = (x.notes || []).map(n => n.id ? n : Object.assign({}, n, { id: 'L' + (n.t || '') + '|' + n.x }));\n    x.tasks = (x.tasks || []).map(t => t.u ? t : Object.assign({}, t, { u: t.doneAt || t.t || '' }));\n    if (x.lunasAt && !x.lu) x.lu = x.lunasAt;\n  });\n}\nfuNormalize();\nfunction fuStatusHtml() {\n  const hm = d => String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0');\n  if (fuSyncState === 'off') return '<span class=\"fu-sync off\" title=\"Isi SYNC_URL dan SYNC_KEY di bagian atas file agar catatan tersinkron antar-perangkat\">Sinkron antar-perangkat belum aktif &middot; data hanya di perangkat ini<\/span>';\n  if (fuSyncState === 'busy') return '<span class=\"fu-sync\">Menyinkronkan&hellip;<\/span>';\n  if (fuSyncState === 'err') return '<span class=\"fu-sync err\">&#9888; Gagal sinkron &middot; tersimpan di perangkat ini, dicoba lagi otomatis<\/span>';\n  return '<span class=\"fu-sync ok\">&#10003; Tersinkron ' + hm(fuLastOk) + '<\/span>';\n}\nfunction fuSetStatus(s) {\n  fuSyncState = s;\n  const el = document.getElementById('fuSyncStatus');\n  if (el) el.innerHTML = fuStatusHtml();\n}\nfunction fuMergeInto(remote) {\n  Object.keys(remote || {}).forEach(f => { fuDB[f] = ppMergeRec(fuDB[f], remote[f]); });\n  fuNormalize();\n}\nasync function fuSyncRemote() {\n  if (!SYNC_URL) { fuSetStatus('off'); return; }\n  if (fuSyncing) return;\n  fuSyncing = true;\n  const sent = fuPending;\n  fuPending = false;\n  fuSetStatus('busy');\n  try {\n    const res = await fetch(SYNC_URL, { method: 'POST', body: JSON.stringify({ divisi: TARGET_DIVISI, key: SYNC_KEY, db: sent ? fuDB : {} }) });\n    const j = await res.json();\n    if (!j.ok) throw new Error(j.error || 'ditolak server');\n    fuMergeInto(j.db);\n    fuSaveLocal();\n    fuSyncLunas();           // status lunas dihitung dari data live di perangkat ini\n    fuLastOk = new Date();\n    fuSetStatus('ok');\n    renderPrioritasTab();\n  } catch (err) {\n    console.error('sinkron catatan', err);\n    if (sent) fuPending = true;\n    fuSetStatus('err');\n  }\n  fuSyncing = false;\n  if (fuPending) { clearTimeout(fuTimer); fuTimer = setTimeout(fuSyncRemote, 1500); }\n}\nif (SYNC_URL) {\n  fuSyncRemote();\n  setInterval(() => { if (document.visibilityState === 'visible') fuSyncRemote(); }, 30000);\n  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') fuSyncRemote(); });\n}\n\nfunction fuFmtFull(iso) {\n  if (!iso) return '-';\n  const d = new Date(iso), p = n => String(n).padStart(2, '0');\n  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;\n}\nconst fuIsoDMY = s => { const m = String(s || '').match(/^(\\d{4})-(\\d{2})-(\\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || '-'); };\nconst fuHasNotes = () => Object.values(fuDB).some(x => (x.notes || []).length);\n\n// Rekap seluruh riwayat catatan (dan tugas) per faktur — aktif maupun yang sudah lunas\nfunction fuRecap() {\n  const cur = {}; rows.forEach(r => { cur[r.faktur] = r; });\n  const recs = Object.entries(fuDB).filter(([, x]) => (x.notes || []).length || (x.tasks || []).some(t => !t.del))\n    .sort((a, b) => String(a[1].nama || '').localeCompare(String(b[1].nama || '')) || a[0].localeCompare(b[0]));\n  const status = x => x.lunasAt ? 'Lunas (' + fuFmtFull(x.lunasAt).slice(0, 10) + ')' : 'Belum lunas';\n  const notes = [], tasks = [];\n  recs.forEach(([f, x]) => {\n    const umur = !x.lunasAt && cur[f] ? cur[f].hari + ' hr' : '-';\n    (x.notes || []).slice().sort((a, b) => String(a.t).localeCompare(String(b.t))).forEach(n => {\n      notes.push([notes.length + 1, n.t ? fuFmtFull(n.t) : 'Catatan lama', x.nama || '-', f, fmtMoney(x.jumlah || 0), fuIsoDMY(x.jto), umur, status(x), n.x]);\n    });\n    (x.tasks || []).filter(t => !t.del).forEach(t => {\n      tasks.push([tasks.length + 1, x.nama || '-', f, t.x, t.pic || '-', t.done ? 'Selesai' : 'Belum selesai', fuFmtFull(t.t), t.done ? fuFmtFull(t.doneAt) : '-']);\n    });\n  });\n  return {\n    noteHead: ['No', 'Waktu Catatan', 'Debitur', 'No. Faktur', 'Jumlah (Rp)', 'Jatuh Tempo', 'Umur', 'Status', 'Catatan'],\n    taskHead: ['No', 'Debitur', 'No. Faktur', 'Tugas', 'PIC', 'Status', 'Dibuat', 'Selesai'],\n    notes, tasks,\n  };\n}\nfunction fuFileName(ext) { return `Riwayat_Catatan_Penagihan_${TARGET_DIVISI.replace(/ /g, '_')}_${fuNow().slice(0, 10)}.${ext}`; }\nfunction fuExportExcel() {\n  if (typeof XLSX === 'undefined') { alert('Library Excel belum termuat — pastikan koneksi internet aktif, lalu coba lagi.'); return; }\n  const rc = fuRecap();\n  if (!rc.notes.length) return;\n  const wb = XLSX.utils.book_new();\n  const top = [['Riwayat Catatan Penagihan — ' + TARGET_DIVISI], [(REPORT_DATE_LABEL ? REPORT_DATE_LABEL + ' · ' : '') + 'dicetak ' + fuFmtFull(fuNow())], []];\n  const ws = XLSX.utils.aoa_to_sheet(top.concat([rc.noteHead], rc.notes));\n  ws['!cols'] = [6, 17, 28, 22, 16, 13, 9, 18, 70].map(w => ({ wch: w }));\n  XLSX.utils.book_append_sheet(wb, ws, 'Riwayat Catatan');\n  if (rc.tasks.length) {\n    const wt = XLSX.utils.aoa_to_sheet(top.concat([rc.taskHead], rc.tasks));\n    wt['!cols'] = [6, 28, 22, 45, 14, 15, 17, 17].map(w => ({ wch: w }));\n    XLSX.utils.book_append_sheet(wb, wt, 'Tugas');\n  }\n  XLSX.writeFile(wb, fuFileName('xlsx'));\n}\nfunction fuExportPdf() {\n  if (!window.jspdf) { alert('Library PDF belum termuat — pastikan koneksi internet aktif, lalu coba lagi.'); return; }\n  const rc = fuRecap();\n  if (!rc.notes.length) return;\n  const doc = new window.jspdf.jsPDF({ orientation: 'landscape' });\n  doc.setFontSize(14); doc.text('Riwayat Catatan Penagihan — ' + TARGET_DIVISI, 14, 15);\n  doc.setFontSize(9); doc.text((REPORT_DATE_LABEL ? REPORT_DATE_LABEL + ' · ' : '') + 'dicetak ' + fuFmtFull(fuNow()), 14, 21);\n  doc.autoTable({\n    head: [rc.noteHead], body: rc.notes, startY: 26, styles: { fontSize: 7.5, cellPadding: 1.6, overflow: 'linebreak' },\n    headStyles: { fillColor: [45, 55, 72] }, rowPageBreak: 'avoid',\n    columnStyles: { 0: { cellWidth: 8 }, 1: { cellWidth: 26 }, 4: { halign: 'right', cellWidth: 25 }, 5: { cellWidth: 20 }, 6: { cellWidth: 14 }, 7: { cellWidth: 24 }, 8: { cellWidth: 'auto' } },\n  });\n  if (rc.tasks.length) {\n    let y = doc.lastAutoTable.finalY + 10;\n    if (y > 180) { doc.addPage(); y = 15; }\n    doc.setFontSize(11); doc.text('Tugas terkait faktur', 14, y);\n    doc.autoTable({ head: [rc.taskHead], body: rc.tasks, startY: y + 3, styles: { fontSize: 7.5, cellPadding: 1.6 }, headStyles: { fillColor: [45, 55, 72] }, rowPageBreak: 'avoid' });\n  }\n  doc.save(fuFileName('pdf'));\n}\n\n\n/* ---------------- Prioritas Penagihan: filter Leasing / Cabang / Supervisor + urut kolom (klik judul) ---------------- */\nconst prState = { key: 'hari', dir: 'desc', leasing: '', cabang: '', spv: '' };\nfunction prLeasing(r) { return (r.leasing && r.leasing !== '-') ? r.leasing : (r.cara === 'Tunai' ? 'Cash' : '-'); }\nfunction prSpv(r) { return r.supervisor || '\\u2013'; }\nfunction prVal(r, k) {\n  switch (k) {\n    case 'name': return r.nama || '';\n    case 'faktur': return r.faktur || '';\n    case 'cabang': return TARGET_DIVISI;\n    case 'metode': return r.cara || '';\n    case 'leasing': return prLeasing(r);\n    case 'jumlah': return Number(r.jumlah) || 0;\n    case 'jto': case 'no': return -(r.hari ?? 0);\n    case 'hari': return r.hari ?? 0;\n    case 'sales': return r.salesman || '';\n    case 'spv': return prSpv(r);\n  }\n  return '';\n}\nfunction prMatch(r) {\n  return (!prState.leasing || prLeasing(r) === prState.leasing) &&\n         (!prState.cabang || TARGET_DIVISI === prState.cabang) &&\n         (!prState.spv || prSpv(r) === prState.spv);\n}\nfunction prSort(list) {\n  const dir = prState.dir === 'asc' ? 1 : -1, k = prState.key;\n  return list.slice().sort((a, b) => {\n    const va = prVal(a, k), vb = prVal(b, k);\n    let c = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb), 'id', { numeric: true, sensitivity: 'base' });\n    if (c === 0) c = (b.hari ?? 0) - (a.hari ?? 0);\n    return c * dir;\n  });\n}\nfunction prFixFilters(all) {\n  const has = (fn, v) => all.some(r => fn(r) === v);\n  if (prState.leasing && !has(prLeasing, prState.leasing)) prState.leasing = '';\n  if (prState.spv && !has(prSpv, prState.spv)) prState.spv = '';\n  if (prState.cabang && prState.cabang !== TARGET_DIVISI) prState.cabang = '';\n}\nfunction prBar(all, list) {\n  const uniq = fn => Array.from(new Set(all.map(fn))).sort((a, b) => String(a).localeCompare(String(b), 'id', { numeric: true }));\n  const sel = (k, label, vals, cur) => `<select data-pf=\"${k}\" title=\"Filter ${label}\"><option value=\"\">Semua ${label}<\/option>${vals.map(v => `<option value=\"${esc(v)}\"${v === cur ? ' selected' : ''}>${esc(v)}<\/option>`).join('')}<\/select>`;\n  return `<div class=\"pr-filters\">${sel('leasing', 'Leasing', uniq(prLeasing), prState.leasing)}${sel('cabang', 'Cabang', [TARGET_DIVISI], prState.cabang)}${sel('spv', 'Supervisor', uniq(prSpv), prState.spv)}<button type=\"button\" class=\"pf-reset\">Reset filter<\/button><span class=\"pf-count\">${list.length} dari ${all.length} faktur<\/span><\/div>`;\n}\nfunction prTh(k, label, cls) {\n  const on = prState.key === k;\n  return `<th${cls ? ` class=\"${cls}\"` : ''} data-sort=\"${k}\">${label}<span class=\"sa${on ? ' on' : ''}\">${on ? (prState.dir === 'asc' ? '\\u25B2' : '\\u25BC') : '\\u21C5'}<\/span><\/th>`;\n}\n(function () {\n  const box = document.getElementById('prioritasBox');\n  if (!box) return;\n  box.addEventListener('change', e => {\n    const k = e.target && e.target.dataset && e.target.dataset.pf;\n    if (!k) return;\n    prState[k] = e.target.value; renderPrioritasTab(true);\n  });\n  box.addEventListener('click', e => {\n    if (e.target.closest('.pf-reset')) { prState.leasing = prState.cabang = prState.spv = ''; renderPrioritasTab(true); return; }\n    const th = e.target.closest('th[data-sort]');\n    if (!th) return;\n    const k = th.dataset.sort;\n    if (prState.key === k) prState.dir = prState.dir === 'asc' ? 'desc' : 'asc';\n    else { prState.key = k; prState.dir = (k === 'jumlah' || k === 'hari') ? 'desc' : 'asc'; }\n    renderPrioritasTab(true);\n  });\n})();\n\nfunction renderPrioritasTab(force) {\n  const box = document.getElementById('prioritasBox');\n  if (!box) return;\n  // jangan timpa ketikan yang sedang berlangsung saat sinkronisasi otomatis\n  if (!force && [...box.querySelectorAll('.fu-in')].some(i => i === document.activeElement || (i.dataset.k !== 'pic' && i.value))) return;\n  const allP = rows.filter(r => (r.hari ?? -9999) > 15);\n  prFixFilters(allP);\n  const list = prSort(allP.filter(prMatch));\n  const total = list.reduce((s, r) => s + (Number(r.jumlah) || 0), 0);\n  const debs = new Set(list.map(r => r.nama)).size;\n  let h = `<div class=\"pr-head\"><h3>Prioritas Penagihan<\/h3><div class=\"pr-tools\"><span>faktur dengan umur &gt; 15 hari &middot; klik baris untuk catatan &amp; tugas<\/span><span id=\"fuSyncStatus\">${fuStatusHtml()}<\/span><button class=\"fu-ghost\" data-a=\"xpdf\"${fuHasNotes() ? '' : ' disabled title=\"Belum ada catatan untuk direkap\"'}>Export PDF<\/button><button class=\"fu-ghost\" data-a=\"xxls\"${fuHasNotes() ? '' : ' disabled title=\"Belum ada catatan untuk direkap\"'}>Export Excel<\/button><\/div><\/div>`;\n  if (allP.length) h += prBar(allP, list);\n  if (!list.length) h += '<div class=\"pr-empty\">' + (allP.length ? 'Tidak ada faktur yang sesuai filter.' : 'Tidak ada faktur dengan umur &gt; 15 hari saat ini.') + '<\/div>';\n  else {\n    h += `<div class=\"pr-banner\"><div><span class=\"pr-dot\"><\/span><b>${list.length} faktur butuh tindak lanjut segera<\/b><\/div><span class=\"pr-sum\">total tertunggak <em>Rp ${fmtMoney(total)}<\/em> &middot; ${debs} debitur<\/span><\/div>\n    <div class=\"pr-wrap\"><div class=\"table-scroll\"><table class=\"detail\"><thead><tr><th><\/th>${prTh('no', 'No', 'num')}${prTh('name', 'Debitur')}${prTh('faktur', 'No. Faktur')}${prTh('cabang', 'Cabang')}${prTh('leasing', 'Leasing')}${prTh('jumlah', 'Jumlah', 'num')}${prTh('jto', 'Tgl. Jatuh Tempo')}${prTh('hari', 'Umur', 'num')}${prTh('sales', 'Sales PIC')}${prTh('spv', 'Supervisor')}<\/tr><\/thead><tbody>`;\n    list.forEach((r, i) => {\n      const open = fuOpen.has(r.faktur), x = fuRec(r, false);\n      const nt = x ? x.notes.length : 0, tk = x ? x.tasks.filter(t => !t.done && !t.del).length : 0;\n      const metode = r.cara === 'Tunai' ? '<span class=\"pr-red\">Tunai (langsung)<\/span>' : 'Kredit';\n      h += `<tr class=\"pr-row\" da w(); fuSave(); renderPrioritasTab(true); }\n      }\n      else if (a === 'xpdf') fuExportPdf();\n      else if (a === 'xxls') fuExportExcel();\n      return;\n    }\n    if (e.target.closest('.pr-detail')) return;\n    const tr = e.target.closest('.pr-row');\n    if (tr) { const f = tr.dataset.f; fuOpen.has(f) ? fuOpen.delete(f) : fuOpen.add(f); renderPrioritasTab(true); }\n  });\n  box.addEventListener('change', e => {\n    const c = e.target.closest('input[data-a=\"tg\"]');\n    if (!c) return;\n    const x = fuDB[c.dataset.f], t = x && x.tasks.find(t => t.id === c.dataset.i);\n    if (t) { t.done = c.checked; t.doneAt = c.checked ? fuNow() : null; t.u = fuNow(); fuSave(); renderPrioritasTab(true); }\n  });\n})();\n\n/* ================= Penjualan: ringkasan 3 cabang x 3 bulan + tab Detail ================= */\nlet SALES_DATE_FMT = \"DMY\";\nconst CAB = [[\"Gatsu\",\"#2F4FD0\"],[\"Flamboyan\",\"#C2410C\"],[\"Gagak Hitam\",\"#0F766E\"]];\nconst BLN = [\"Januari\",\"Februari\",\"Maret\",\"April\",\"Mei\",\"Juni\",\"Juli\",\"Agustus\",\"September\",\"Oktober\",\"November\",\"Desember\"];\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n\nfunction months() {\n  const a = [];\n  for (let i = 2; i >= 0; i--) {\n    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);\n    a.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));\n  }\n  return a;\n}\nconst monName = (m, full) => { const n = BLN[+m.slice(5) - 1]; return full ? n : n.slice(0, 3); };\nfunction periodLabel() { const M = months(); return monName(M[0]) + '\\u2013' + monName(M[2]) + ' ' + M[2].slice(0, 4); }\nconst inPeriod = r => months().includes((r.tanggal || '').slice(0, 7));\n\nfunction monthsN(n) {\n  const a = [];\n  for (let i = n - 1; i >= 0; i--) {\n    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);\n    a.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));\n  }\n  return a;\n}\nconst triState = {}, triDefs = {};\nconst shortMon = m => monName(m) + ' ' + m.slice(2, 4);\nfunction rangeLabel(M, sel) {\n  if (!sel.length) return 'belum ada bulan dipilih';\n  if (sel.length === 1) return monName(sel[0], true) + ' ' + sel[0].slice(0, 4);\n  const idx = sel.map(m => M.indexOf(m));\n  if (idx.every((v, i) => i === 0 || v === idx[i - 1] + 1)) {\n    const a = sel[0], z = sel[sel.length - 1];\n    return monName(a) + (a.slice(0, 4) !== z.slice(0, 4) ? ' ' + a.slice(0, 4) : '') + '\\u2013' + monName(z) + ' ' + z.slice(0, 4);\n  }\n  return sel.map(shortMon).join(', ');\n}\n\nfunction renderTri(elId, title, keyFn, colLabel) {\n  triDefs[elId] = [title, keyFn, colLabel];\n  const st = triState[elId] || (triState[elId] = { n: 3, off: new Set() });\n  const M = monthsN(st.n), sel = M.filter(m => !st.off.has(m));\n  const col = (CAB.find(c => c[0] === TARGET_DIVISI) || [0, '#2F4FD0'])[1];\n  let h = `<div class=\"tri-head\"><h2>${title}<\/h2><span>${rangeLabel(M, sel)}<\/span><span>&middot; ${TARGET_DIVISI}<\/span><\/div>\n    <div class=\"tri-bar\"><select class=\"select-filter\" data-e=\"${elId}\" title=\"Rentang bulan\">${[3, 6].map(n => `<option value=\"${n}\"${n === st.n ? ' selected' : ''}>${n} bulan berjalan<\/option>`).join('')}<\/select>\n    <div class=\"tri-chips\"><button type=\"button\" class=\"tri-chip${st.off.size ? '' : ' on'}\" data-m=\"*\">Semua<\/button>${M.map(m => `<button type=\"button\" class=\"tri-chip${st.off.has(m) ? '' : ' on'}\" data-m=\"${m}\">${shortMon(m)}<\/button>`).join('')}<\/div><\/div><div class=\"tri\">`;\n  sel.forEach(m => {\n    const items = SALES.filter(r => r.divisi === TARGET_DIVISI && r.tanggal.slice(0, 7) === m);\n    const map = new Map();\n    items.forEach(r => { const k = keyFn(r) || '-'; map.set(k, (map.get(k) || 0) + 1); });\n    const rows = [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));\n    h += `<di \nfunction renderDetail() {\n  const mo = $('dMonth').value, g = $('dGroup').value, q = $('dSearch').value.trim().toLowerCase();\n  const list = SALES.filter(r => inPeriod(r) && r.divisi === TARGET_DIVISI && (mo === 'all' || r.tanggal.slice(0, 7) === mo) &&\n    (!q || (r.nama + ' ' + r.namabrg + ' ' + r.salesman + ' ' + r.faktur).toLowerCase().includes(q)));\n  const cmp = (a, b) => {\n    let c = String(a[dS.k] || '').localeCompare(String(b[dS.k] || '')) * dS.d;\n    return c || b.tanggal.localeCompare(a.tanggal);\n  };\n  const map = new Map();\n  list.forEach(r => { const k = r[g] || '-'; if (!map.has(k)) map.set(k, []); map.get(k).push(r); });\n  const groups = [...map.entries()].sort((a, b) => b[1].length - a[1].length);\n  dNames = groups.map(g => g[0]);\n  $('dInfo').textContent = `${list.length} unit \\u00B7 ${TARGET_DIVISI} \\u00B7 ${mo === 'all' ? periodLabel() : monName(mo, true) + ' ' + mo.slice(0, 4)}`;\n  const arrow = k => dS.k === k ? `<span class=\"arrow\">${dS.d > 0 ? '\\u25B2' : '\\u25BC'}<\/span>` : '';\n  const head = '<th>No<\/th>' + DCOLS.map(([k, l]) => `<th class=\"sortable\" data-k=\"${k}\">${l}${arrow(k)}<\/th>`).join('');\n  $('detailSections').innerHTML = groups.length ? groups.map(([name, items]) => `\n    <div class=\"leasing-section\">\n      <div class=\"leasing-head dtoggle\" data-g=\"${esc(name)}\" title=\"Klik untuk minimize / buka\"><span class=\"chev\">${dCol.has(name) ? '\\u25B8' : '\\u25BE'}<\/span><span class=\"name\">${esc(name)}<\/span><span class=\"meta\">${items.length} unit<\/span><\/div>\n      <div class=\"leasing-table-scroll\"${dCol.has(name) ? ' hidden' : ''}><table class=\"detail\"><thead><tr>${head}<\/tr><\/thead><tbody>\n      ${items.slice().sort(cmp).map((r, i) => `<tr><td class=\"num\">${i + 1}<\/td><td class=\"nama\">${esc(r.nama)}<\/td><td>${fmtDateShort(r.tanggal)}<\/td><td>${esc(r.namabrg || '\\u2013')}<\/td><td>${esc(r.leasing)}<\/td><td>${esc(r.asuransi)}<\/td><td>${esc(r.salesman || '\\u2013')}<\/td><t ();\nrenderFollowupTab();\nrenderPrioritasTab();\nrenderSalesAll();\ndocument.getElementById('sourceCount').textContent = rows.length;\n\n/* ================= Live sync dari Google Sheet (tiap 30 detik) ================= */\nconst FILE_ID = \"1ul2WqwEb4X66Q6CYdycNvtyaLu08axFkZL75FI-qdmM\";\nconst XLSX_MIME = \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\";\nconst KNOWN_DIVISI = [\"Gatsu\", \"Flamboyan\", \"Gagak Hitam\"];\nconst syncRowEl = document.getElementById('syncRow');\nconst syncTextEl = document.getElementById('syncText');\nlet lastSyncedLabel = null; // tanggal-jam refresh terakhir yang BERHASIL, tetap tampil walau status berubah\n\nfunction setSync(state, message) {\n  syncRowEl.className = 'sync-row ' + state;\n  const suffix = (lastSyncedLabel && state !== 'live')\n    ? ` &middot; Terakhir refresh: <strong>${lastSyncedLabel}<\/strong>`\n    : '';\n  syncTextEl.innerHTML = message + suffix;\n}\n\nfunction isoFromExcelDate(v) {\n  if (v == null || v === \"\") return null;\n  if (v instanceof Date) return v.toISOString().slice(0, 10);\n  if (typeof v === \"number\") {\n    const d = XLSX.SSF.parse_date_code(v);\n    if (!d) return null;\n    return `${d.y.toString().padStart(4,'0')}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;\n  }\n  return String(v); // free text like \"Belum Buat Tagihan\" or \"Kontrak Go Rental\"\n}\n\nfunction cellVal(ws, colLetter, r) {\n  const addr = colLetter + (r + 1); // r is 0-based row index\n  const cell = ws[addr];\n  return cell ? cell.v : undefined;\n}\n\nfunction extractGatsuFromWorkbook(wb) {\n  const ws = wb.Sheets[\"Sheet1\"];\n  if (!ws || !ws['!ref']) throw new Error(\"Sheet 'Sheet1' tidak ditemukan\");\n  const range = XLSX.utils.decode_range(ws['!ref']);\n\n  // Cari baris \"Per : ...\" di kolom A berdasarkan ISINYA (bukan asumsi posisi baris ke-4),\n  // supaya tetap benar walau ada baris disisipkan/dihapus di atasnya.\n  let reportDateLabel = REPORT_DATE_LABEL;\n  for (let r = 0; r < 20; r++) {\n    const v = cellVal(ws, 'A', r);\n    if (typeof v === 'string' && v.trim().toLowerCase().startsWith('per')) {\n      reportDateLabel = v.trim();\n      break;\n    }\n  }\n\n  // Sheet1 adalah laporan final: sudah mengecualikan faktur yang lunas dan sudah\n  // menghitung Divisi/Leasing/Salesman dengan benar. Kolom: A=No, B=No.Cust,\n  // C=Nama Debitur, D=Faktur No., E=TOP, F=Tgl.Jto, G=Jumlah, H=Giro, I=Type,\n  // J=Divisi, K=Cara Pembelian, L=Leasing, M=Salesman (\"KODE=Nama Lengkap\"),\n  // N=Supervisor, O=Tgl Buat Tagihan, P=Tgl Barcode, Q=Hasil Followup.\n  const out = [];\n  for (let r = range.s.r + 9; r <= range.e.r; r++) { // baris data dimulai dari baris ke-10 (index 9)\n    const nama = cellVal(ws, 'C', r);\n    if (nama == null || nama === \"\") continue; // lewati baris kosong/sisa template & baris \"Total:\"\n    const divisi = cellVal(ws, 'J', r);\n    if (divisi !== TARGET_DIVISI) continue; // dashboard ini khusus divisi ini\n\n    let salesman = cellVal(ws, 'M', r);\n    if (typeof salesman === 'string' && salesman.includes('=')) {\n      salesman = salesman.slice(salesman.indexOf('=') + 1).trim();\n    }\n    const followupRaw = cellVal(ws, 'Q', r);\n\n    out.push({\n      noCust: cellVal(ws, 'B', r),\n      nama: nama,\n      faktur: cellVal(ws, 'D', r),\n      top: cellVal(ws, 'E', r) || 0,\n      tglJto: isoFromExcelDate(cellVal(ws, 'F', r)),\n      jumlah: cellVal(ws, 'G', r) || 0,\n      type: cellVal(ws, 'I', r),\n      cara: cellVal(ws, 'K', r) || \"-\",\n      leasing: cellVal(ws, 'L', r) || \"-\",\n      salesman: salesman,\n      supervisor: cellVal(ws, 'N', r),\n      tglTagih: isoFromExcelDate(cellVal(ws, 'O', r)),\n      tglBarcode: isoFromExcelDate(cellVal(ws, 'P', r)),\n      followup: (followupRaw === \"#N/A\" ? null : followupRaw),\n    });\n  }\n  return { rows: out, reportDateLabel };\n}\n\nfunction applyNewData(list, reportDateLabel, syncedAt) {\n  rows = list.map(r => ({...r, hari: computeHari(r.t aria-live=\"polite\">Mengambil data dari Google Sheets...<\/div>\n\n  <section class=\"cards\" id=\"cards\" aria-label=\"Ringkasan\">\n    <div class=\"card big\" data-filter=\"\" role=\"button\" tabindex=\"0\" title=\"Tampilkan semua unit\">\n      <div class=\"lbl\" id=\"bigLabel\">Total BPKB Cash belum diserahkan<\/div>\n      <div class=\"bigval\" id=\"bigVal\">0<\/div>\n      <div class=\"unit\" id=\"bigSub\"><\/div>\n    <\/div>\n    <div class=\"card\" data-filter=\"lt60\" role=\"button\" tabindex=\"0\" title=\"Klik untuk melihat daftar unit\">\n      <div class=\"lbl\"><span class=\"dot\" style=\"background:var(--green)\"><\/span>&lt; 60 hari<\/div>\n      <div class=\"val\" id=\"c60\">0<\/div>\n      <div class=\"unit\">unit<\/div>\n    <\/div>\n    <div class=\"card\" data-filter=\"gt60\" role=\"button\" tabindex=\"0\" title=\"Klik untuk melihat daftar unit\">\n      <div class=\"lbl\"><span class=\"dot\" style=\"background:var(--orange)\"><\/span>&gt; 60 hari<\/div>\n      <div class=\"val\" id=\"c90\">0<\/div>\n      <div class=\"unit\">unit<\/div>\n    <\/div>\n    <div class=\"card\" data-filter=\"stnk\" role=\"button\" tabindex=\"0\" title=\"Klik untuk melihat daftar unit\">\n      <div class=\"lbl\"><span class=\"dot\" style=\"background:var(--blue)\"><\/span>STNK belum diserahkan<\/div>\n      <div class=\"val\" id=\"cStnk\">0<\/div>\n      <div class=\"unit\">unit, tanggal serah STNK masih kosong<\/div>\n    <\/div>\n    <div class=\"card alert\" data-filter=\"gt90\" role=\"button\" tabindex=\"0\" title=\"Klik untuk melihat daftar unit\">\n      <div class=\"lbl\"><span class=\"dot\" style=\"background:var(--red)\"><\/span>&gt; 90 hari<\/div>\n      <div class=\"val\" id=\"c91\">0<\/div>\n      <div class=\"unit\">unit &middot; prioritas serah<\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"sechead\">\n    <h2>BPKB Cash<\/h2>\n    <span class=\"cap\">cabang Flamboyan &middot; per supervisor<\/span>\n  <\/div>\n\n  <div class=\"tabs noprint\" role=\"tablist\" aria-label=\"Divisi\" id=\"tabs\" hidden><\/div>\n\n  <div class=\"views noprint\" role=\"tablist\" aria-label=\"Tampilan\" id=\"views\"><\/div>\n\n  <div class=\"tabs noprint\" role=\"tablist\" aria-label=\"Supervisor\" id=\"supPills\" hidden><\/div>\n\n  <div class=\"tools noprint\">\n    <input type=\"search\" id=\"q\" placeholder=\"Cari customer, no rangka, no polisi, salesman, supervisor\" aria-label=\"Cari\">\n    <span class=\"count\" id=\"count\"><\/span>\n    <button class=\"btn plain\" id=\"btnPdf\" type=\"button\">Export PDF<\/button>\n    <button class=\"btn plain\" id=\"btnExcel\" type=\"button\">Export Excel<\/button>\n  <\/div>\n\n  <div class=\"chip noprint\" id=\"chip\" hidden><\/div>\n\n  <div class=\"table-wrap\" id=\"detailWrap\">\n    <table>\n      <thead><tr id=\"headRow\"><\/tr><\/thead>\n      <tbody id=\"tbody\"><\/tbody>\n    <\/table>\n    <div class=\"empty\" id=\"empty\" hidden><\/div>\n  <\/div>\n\n  <div class=\"table-wrap\" id=\"supWrap\" hidden>\n    <table>\n      <thead><tr id=\"supHead\"><\/tr><\/thead>\n      <tbody id=\"supBody\"><\/tbody>\n    <\/table>\n    <div class=\"empty\" id=\"supEmpty\" hidden><\/div>\n  <\/div>\n  <p class=\"foot\">Umur (hari) dihitung otomatis: tanggal hari ini dikurangi Terima Tanggal BPKB (dibulatkan). Kategori &lt; 60, &gt; 60, dan &gt; 90 hari mengikuti umur tersebut. Salesman, Supervisor, dan Divisi dibaca otomatis dari sheet Data berdasarkan No. BAST. Klik kartu ringkasan untuk menampilkan daftar unitnya. Tab Detail Per Supervisor menampilkan unit milik satu supervisor. Data diperbarui otomatis tiap 2 menit.<\/p>\n<\/main>\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<script>\n(function () {\n  /* ---------- konfigurasi ---------- */\n  var FILE_ID = \"1qPXn1eOM3J5ygKKSa7Ld5qmf4GCSsyS60CojPguaZ_c\";\n  var SERVER = \"Google Drive\", TOOL = \"download_file_content\";\n  var XLSX_MIME = \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\";\n  var DIVISIONS = [\"Flamboyan\"];\n  var ALL = \"Semua Cabang\", TABS = DIVISIONS;\n  var REFRESH_MS = 120000, REFRESH_TXT = \"2 menit\";\n  var MONTHS = [\"Januari\",\"Februari\",\"Maret\",\"April\",\"Mei\",\"Juni\",\"Juli\",\"Agustus\",\"September\",\"Oktober\",\"November\",\"Desember\"];\n\n  var el = function (id) { return document.getElementById(id); };\n  var nf = new Intl.NumberFormat(\"id-ID\");\n  function pad(n) { return (n < 10 ? \"0\" : \"\") + n; }\n  function esc(s) {\n    return String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\").replace(/\"/g, \"&quot;\");\n  }\n\n  /*HELPERS*/\n  function parseCSV(text) {\n    var out = [], row = [], cell = \"\", inQ = false;\n    for (var i = 0; i < text.length; i++) {\n      var c = text[i];\n      if (inQ) {\n        if (c === '\"') { if (text[i + 1] === '\"') { cell += '\"'; i++; } else { inQ = false; } }\n        else { cell += c; }\n      } else if (c === '\"') { inQ = true; }\n      else if (c === \",\") { row.push(cell); cell = \"\"; }\n      else if (c === \"\\n\") { row.push(cell); out.push(row); row = []; cell = \"\"; }\n      else if (c === \"\\r\") { }\n      else { cell += c; }\n    }\n    if (cell.length || row.length) { row.push(cell); out.push(row); }\n    return out;\n  }\n\n  // Angka hari dari kolom <60Hr / >60Hr / >90Hr: \"35\", \"35.0\", \"1.179\", \"1,179\" -> 35, 35, 1179, 1179\n  function num(s) {\n    s = String(s == null ? \"\" : s).trim();\n    if (!s || s === \"-\") return null;\n    if (/^\\d{1,3}([.,]\\d{3})+$/.test(s)) return parseInt(s.replace(/[.,]/g, \"\"), 10);   // pemisah ribuan\n    if (/^\\d+[.,]\\d+$/.test(s)) return Math.round(parseFloat(s.rep
