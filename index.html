<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Flamboyan - PT Perintis Perkasa</title>
<style>

  :root:not([data-theme="light"]){color-scheme:light dark}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171C;--surface:#1C2027;--ink:#E7E9EC;--muted:#9AA3B2;--border:#2B303A;--grad:linear-gradient(120deg,#1C1E27,#1E2029 55%,#1A2230)}}
  :root[data-theme="dark"]{--bg:#14171C;--surface:#1C2027;--ink:#E7E9EC;--muted:#9AA3B2;--border:#2B303A;--grad:linear-gradient(120deg,#1C1E27,#1E2029 55%,#1A2230)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
  .appbar{flex:none;display:flex;align-items:stretch;justify-content:space-between;gap:16px;padding:0 0 0 2px;background:var(--surface);border-bottom:1px solid var(--border)}
  .tabs{display:flex;gap:2px;overflow:visible;min-width:0;flex:0 1 auto}
  .tab{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;font-size:15px;font-weight:500;color:var(--muted);
    padding:16px 18px 15px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
  @media (max-width:560px){.who{display:none}.tab{padding:14px 14px 13px;font-size:14px}}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
  .who{align-self:center;padding-right:18px;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .panels{flex:1;min-height:0;position:relative}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
  iframe.on{display:block}
  /* gate */
  .gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--grad),var(--bg)}
  .gate.hidden{display:none}
  .box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;box-shadow:0 10px 40px rgba(16,24,40,.10);text-align:center}
  .co{color:var(--muted);font-size:13px;margin-bottom:4px}
  .ttl{font-family:var(--serif);font-weight:700;font-size:28px;margin-bottom:22px}
  .field{position:relative;margin-bottom:12px}
  .field input{width:100%;padding:12px 44px 12px 14px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:10px}
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .eye svg{width:18px;height:18px}
  .go{width:100%;padding:12px;font:inherit;font-weight:600;font-size:15px;color:#fff;background:var(--accent);border:0;border-radius:10px;cursor:pointer}
  .go:hover{filter:brightness(.95)}
  .err{margin-top:12px;color:#C24A3E;font-size:13.5px}
  .hidden{display:none}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="box">
    <div class="co">PT Perintis Perkasa, Medan</div>
    <div class="ttl">Flamboyan</div>
    <form id="f">
      <div class="field"><input type="password" id="pw" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required><button type="button" class="eye" id="eye"></button></div>
      <button type="submit" class="go">Masuk</button>
    </form>
    <div id="err" class="err hidden">Password salah, coba lagi.</div>
  </div>
</div>

<div class="appbar">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-piutang" aria-selected="true" data-p="piutang">Piutang</button>
    <button class="tab" role="tab" id="t-bpkb" aria-selected="false" data-p="bpkb">BPKB Cash</button>
  </div>
  <div class="who">Flamboyan &middot; PT Perintis Perkasa</div>
</div>
<div class="panels">
  <iframe id="fr-piutang" class="on" title="Piutang Flamboyan"></iframe>
  <iframe id="fr-bpkb" title="BPKB Cash Flamboyan"></iframe>
</div>

on computeHari(tglJto) {\n  const d = parseDate(tglJto);\n  if (!d) return null;\n  return Math.round((today - d) / 86400000);\n}\n\nconst NO_TAGIH_MARKERS = [\"belum buat tagihan\", \"-\", \"\"];\nfunction categorize(row) {\n  const raw = (row.tglTagih || \"\").toString().trim().toLowerCase();\n  const hasTagih = raw !== \"\" && !NO_TAGIH_MARKERS.includes(raw);\n  const hari = computeHari(row.tglJto);\n  if (!hasTagih) return \"belum\";\n  if (hari === null) return \"notdue\";\n  if (hari < 1) return \"notdue\";\n  if (hari <= 7) return \"d7\";\n  if (hari <= 14) return \"d14\";\n  if (hari <= 26) return \"d26\";\n  return \"over\";\n}\n\nlet rows = RAW.map(r => ({...r, hari: computeHari(r.tglJto), cat: categorize(r)}));\n\nfunction sortGroup(list) {\n  return list.sort((a, b) => {\n    const l = (a.leasing || \"\").localeCompare(b.leasing || \"\");\n    if (l !== 0) return l;\n    return (b.hari ?? -999) - (a.hari ?? -999);\n  });\n}\n\nfunction fmtMoney(n) { return Math.round(n).toLocaleString('id-ID'); }\nfunction fmtDateShort(s) {\n  const d = parseDate(s);\n  if (!d) return s || \"\\u2013\";\n  const dd = String(d.getDate()).padStart(2, '0');\n  const mm = String(d.getMonth() + 1).padStart(2, '0');\n  return `${dd}/${mm}/${d.getFullYear()}`;\n}\n\n\nlet activeFilter = \"all\";\nlet searchTerm = \"\";\n\nfunction buildPills() {\n  const el = document.getElementById('pills');\n  const counts = {};\n  const totals = {};\n  CAT_ORDER.forEach(c => { counts[c]=0; totals[c]=0; });\n  rows.forEach(r => { counts[r.cat]++; totals[r.cat]+=Number(r.jumlah)||0; });\n\n  const allTotal = rows.reduce((s,r)=>s+(Number(r.jumlah)||0),0);\n  let html = `<div class=\"pill ${activeFilter==='all'?'active':''}\" data-cat=\"all\">\n      <span class=\"dot\" style=\"background:var(--ink)\"><\/span>\n      Semua <span class=\"cnt\">${rows.length}<\/span>\n    <\/div>`;\n  CAT_ORDER.forEach(c => {\n    if (counts[c] === 0 && c === 'notdue') return; // hide empty \"belum jatuh tempo\" bucket most of the time\n    html += `<div class=\"pill ${activeFilter===c?'active':''}\" data-cat=\"${c}\">\n        <span class=\"dot\" style=\"background:${CATS[c].color}\"><\/span>\n        ${CATS[c].label} <span class=\"cnt\">${counts[c]}<\/span>\n      <\/div>`;\n  });\n  el.innerHTML = html;\n  el.querySelectorAll('.pill').forEach(p => {\n    p.addEventListener('click', () => {\n      activeFilter = p.dataset.cat;\n      render();\n    });\n  });\n\n  // hero stats\n  document.getElementById('totalAmount').textContent = fmtMoney(allTotal);\n  document.getElementById('totalCount').textContent = rows.length;\n  document.getElementById('overCount').textContent = counts.over;\n  document.getElementById('within7Count').textContent = counts.d7;\n\n  // composition bar\n  const comp = document.getElementById('composition');\n  comp.innerHTML = \"\";\n  CAT_ORDER.forEach(c => {\n    if (!totals[c]) return;\n    const pct = (totals[c]/allTotal*100).toFixed(2);\n    const span = document.createElement('span');\n    span.style.width = pct + \"%\";\n    span.style.background = CATS[c].color;\n    span.title = CATS[c].label + \": \" + pct + \"%\";\n    comp.appendChild(span);\n  });\n}\n\nfunction matchesSearch(r) {\n  if (!searchTerm) return true;\n  const hay = (r.nama + \" \" + r.faktur + \" \" + r.salesman + \" \" + r.noCust).toLowerCase();\n  return hay.includes(searchTerm);\n}\n\nfunction render() {\n  buildPills();\n  const tbody = document.getElementById('tbody');\n  tbody.innerHTML = \"\";\n\n  let visible = rows.filter(matchesSearch);\n  if (activeFilter !== \"all\") visible = visible.filter(r => r.cat === activeFilter);\n\n  document.getElementById('resultCount').textContent = visible.length + \" dari \" + rows.length + \" baris\";\n  document.getElementById('emptyState').style.display = visible.length ? \"none\" : \"block\";\n\n  if (activeFilter === \"all\") {\n    CAT_ORDER.forEach(c => {\n      const group = sortGroup(visible.filter(r => r.cat === c));\n      if (!group.length) return;\n      const groupTotal = group.reduce((s,r)=>s+(Number(r.jumlah)||0),0);\n      const gh = document.createElement('tr');\n      gh.className = 'grouphead';\n      gh.innerHTML = `<td colspan=\"9\">\n          <span class=\"swatch\" style=\"background:${CATS[c].color}\"><\/span>${CATS[c].label}\n          <span class=\"ghcount\">${group.length} debitur<\/span>\n          <span class=\"ghtotal\">Rp ${fmtMoney(groupTotal)}<\/span>\n        <\/td>`;\n      tbody.appendChild(gh);\n      group.forEach(r => tbody.appendChild(renderRow(r)));\n    });\n  } else {\n    sortGroup(visible).forEach(r => tbody.appendChild(renderRow(r)));\n  }\n}\n\nfunction renderRow(r) {\n  const tr = document.createElement('tr');\n  tr.className = 'rowcat';\n  tr.style.borderLeftColor = CATS[r.cat].color;\n  tr.innerHTML = `\n    <td class=\"nama\">${r.nama}<\/td>\n    <td>${r.faktur}<\/td>\n    <td>${r.type||\"\"}<\/td>\n    <td>${fmtDateShort(r.tglJto)}<\/td>\n    <td class=\"num money\">${fmtMoney(r.jumlah)}<\/td>\n    <td>${r.leasing}<\/td>\n    <td>${r.salesman||\"\\u2013\"}<\/td>\n    <td>${r.supervisor||\"\\u2013\"}<\/td>\n    <td class=\"num hari\">${r.hari===null?\"\\u2013\":r.hari}<\/td>`;\n  return tr;\n}\n\ndocument.getElementById('search').addEventListener('input', (e) => {\n  searchTerm = e.target.value.trim().toLowerCase();\n  render();\n});\n\n/* ---------- Tab: Per Leasing ---------- */\nconst BUCKET_KEYS = [\"belum\", \"d7\", \"d14\", \"d26\", \"over\"];\n\nfunction groupByLeasing(list) {\n  const map = new Map();\n  list.forEach(r => {\n    const key = r.leasing || \"Lainnya\";\n    if (!map.has(key)) map.set(key, []);\n    map.get(key).push(r);\n  });\n  return [...map.entries()]\n    .map(([leasing, items]) => ({\n      leasing,\n      items: sortGroup(items.slice()),\n      total: items.reduce((s,r)=>s+(Number(r.jumlah)||0), 0),\n      bucketTotals: BUCKET_KEYS.reduce((acc,k) => {\n        acc[k] = items.filter(r=>r.cat===k).reduce((s,r)=>s+(Number(r.jumlah)||0), 0);\n        return acc;\n      }, {}),\n    }))\n    .sort((a,b) => b.total - a.total);\n}\n\nfunction renderLeasingTab() {\n  const groups = groupByLeasing(rows);\n\n  const tbody = document.getElementById('matrixBody');\n  tbody.innerHTML = \"\";\n  let grand = { count:0, belum:0, d7:0, d14:0, d26:0, over:0, total:0 };\n  const cell = (v) => v ? `Rp ${fmtMoney(v)}` : `<span class=\"zero\">&ndash;<\/span>`;\n  groups.forEach(g => {\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      <td class=\"leasing-name\">${g.leasing}<\/td>\n      <td>${g.items.length}<\/td>\n      <td>${cell(g.bucketTotals.belum)}<\/td>\n      <td>${cell(g.bucketTotals.d7)}<\/td>\n      <td>${cell(g.bucketTotals.d14)}<\/td>\n      <td>${cell(g.bucketTotals.d26)}<\/td>\n      <td>${cell(g.bucketTotals.over)}<\/td>\n      <td><strong>Rp ${fmtMoney(g.total)}<\/strong><\/td>`;\n    tbody.appendChild(tr);\n    grand.count += g.items.length;\n    grand.belum += g.bucketTotals.belum; grand.d7 += g.bucketTotals.d7;\n    grand.d14 += g.bucketTotals.d14; grand.d26 += g.bucketTotals.d26; grand.over += g.bucketTotals.over;\n    grand.total += g.total;\n  });\n  const gr = document.createElement('tr');\n  gr.className = 'grand';\n  gr.innerHTML = `\n    <td class=\"leasing-name\">Total Flamboyan<\/td>\n    <td>${grand.count}<\/td>\n    <td>Rp ${fmtMoney(grand.belum)}<\/td>\n    <td>Rp ${fmtMoney(grand.d7)}<\/td>\n    <td>Rp ${fmtMoney(grand.d14)}<\/td>\n    <td>Rp ${fmtMoney(grand.d26)}<\/td>\n    <td>Rp ${fmtMoney(grand.over)}<\/td>\n    <td>Rp ${fmtMoney(grand.total)}<\/td>`;\n  tbody.appendChild(gr);\n\n  const el = document.getElementById('leasingSections');\n  el.innerHTML = \"\";\n  groups.forEach(g => {\n    const section = document.createElement('div');\n    section.className = 'leasing-section';\n    section.innerHTML = `\n      <div class=\"leasing-head\">\n        <span class=\"name\">${g.leasing}<\/span>\n        <span class=\"meta\">${g.items.length} debitur &middot; Rp ${fmtMoney(g.total)}<\/span>\n      <\/div>\n      <div class=\"leasing-table-scroll\">\n        <table class=\"detail\">\n          <thead>\n            <tr>\n              <th>Nama Debitur<\/th>\n              <th>Faktur No.<\/th>\n              <th>Tipe Unit<\/th>\n              <th>Jth. Tempo<\/th>\n              <th class=\"num\">Jumlah<\/th>\n              <th>Cara Bayar<\/th>\n              <th>Salesman<\/th>\n              <th>Supervisor<\/th>\n              <th class=\"num\">Hari<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody><\/tbody>\n        <\/table>\n      <\/div>`;\n    const tb = section.querySelector('tbody');\n    g.items.forEach(r => {\n      const tr = document.createElement('tr');\n      tr.className = 'rowcat';\n      tr.style.borderLeftColor = CATS[r.cat] ? CATS[r.cat].color : 'transparent';\n      tr.innerHTML = `\n        <td class=\"nama\">${r.nama}<\/td>\n        <td>${r.faktur}<\/td>\n        <td>${r.type||\"\"}<\/td>\n        <td>${fmtDateShort(r.tglJto)}<\/td>\n        <td class=\"money\">${fmtMoney(r.jumlah)}<\/td>\n        <td>${r.cara||\"\\u2013\"}<\/td>\n        <td>${r.salesman||\"\\u2013\"}<\/td>\n        <td>${r.supervisor||\"\\u2013\"}<\/td>\n        <td class=\"hari\">${r.hari===null?\"\\u2013\":r.hari}<\/td>`;\n      tb.appendChild(tr);\n    });\n    el.appendChild(section);\n  });\n}\n\n/* ---------- Tab switching ---------- */\ndocument.querySelectorAll('.tab').forEach(btn => {\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    const target = btn.dataset.tab;\n    document.getElementById('tabpanel-umur').hidden = target !== 'umur';\n    document.getElementById('tabpanel-leasing').hidden = target !== 'leasing';\n    document.getElementById('tabpanel-followup').hidden = target !== 'followup';\n    document.getElementById('tabpanel-penjualanleasing').hidden = target !== 'penjualanleasing';\n    document.getElementById('tabpanel-penjualanasuransi').hidden = target !== 'penjualanasuransi';\n    document.getElementById('tabpanel-penjualansupervisor').hidden = target !== 'penjualansupervisor';\n    document.getElementById('tabpanel-salesterbanyak').hidden = target !== 'salesterbanyak';\n    document.getElementById('tabpanel-detailpenjualan').hidden = target !== 'detailpenjualan';\n  });\n});\n\nfunction hasTagihValue(r) {\n  const raw = (r.tglTagih || \"\").toString().trim().toLowerCase();\n  return raw !== \"\" && !NO_TAGIH_MARKERS.includes(raw);\n}\n\nlet followupSearchTerm = \"\";\nlet followupLeasingValue = \"\";\nlet followupStatus = \"all\";\nlet followupSortKey = \"leasing\";\nlet followupSortDir = \"asc\";\n\nfunction populateLeasingFilter() {\n  const sel = document.getElementById('followupLeasingFilter');\n  const current = sel.value;\n  const leasings = [...new Set(rows.map(r => r.leasing || \"-\"))].sort((a, b) => a.localeCompare(b));\n  sel.innerHTML = '<option value=\"\">Semua leasing<\/option>' +\n    leasings.map(l => `<option value=\"${l}\">${l}<\/option>`).join('');\n  if (leasings.includes(current)) sel.value = current;\n}\n\nfunction sortVal(r, key) {\n  switch (key) {\n    case 'no': return 0;\n    case 'jumlah': return Number(r.jumlah) || 0;\n    case 'hari': return r.hari ?? -9999;\n    case 'tglJto': case 'tglTagih': case 'tglBarcode': {\n      const d = parseDate(r[key]);\n      return d ? d.getTime() : -Infinity;\n    }\n    default: return (r[key] || \"\").toString().toLowerCase();\n  }\n}\n\nfunction renderFollowupTab() {\n  populateLeasingFilter();\n  const tbody = document.getElementById('followupBody');\n  tbody.innerHTML = \"\";\n\n  let list = rows.filter(r => {\n    if (followupLeasingValue && (r.leasing || \"-\") !== followupLeasingValue) return false;\n    const sudah = hasTagihValue(r);\n    if (followupStatus === 'sudah' && !sudah) return false;\n    if (followupStatus === 'belum' && sudah) return false;\n    if (followupSearchTerm) {\n      const hay = (r.nama + \" \" + r.faktur + \" \" + r.salesman + \" \" + r.noCust).toLowerCase();\n      if (!hay.includes(followupSearchTerm)) return false;\n    }\n    return true;\n  });\n\n  list.sort((a, b) => {\n    const va = sortVal(a, followupSortKey), vb = sortVal(b, followupSortKey);\n    let cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;\n    if (followupSortKey === 'leasing' && cmp === 0) cmp = (b.hari ?? -999) - (a.hari ?? -999);\n    return followupSortDir === 'asc' ? cmp : -cmp;\n  });\n\n  list.forEach((r, idx) => {\n    const tr = document.createElement('tr');\n    tr.className = 'rowcat';\n    tr.style.borderLeftColor = CATS[r.cat] ? CATS[r.cat].color : 'transparent';\n    const sudah = hasTagihValue(r);\n    const badge = sudah\n      ? `<span class=\"badge badge-sudah\">Sudah<\/span>${fmtDateShort(r.tglTagih)}`\n      : `<span class=\"badge badge-belum\">Belum<\/span>`;\n    tr.innerHTML = `\n      <td class=\"num\">${idx + 1}<\/td>\n      <td class=\"nama\">${r.nama}<\/td>\n      <td>${fmtDateShort(r.tglJto)}<\/td>\n      <td>${r.leasing}<\/td>\n      <td>${TARGET_DIVISI}<\/td>\n      <td class=\"num money\">${fmtMoney(r.jumlah)}<\/td>\n      <td>${badge}<\/td>\n      <td class=\"num hari\">${r.hari===null?\"\\u2013\":r.hari}<\/td>\n      <td>${r.salesman||\"\\u2013\"}<\/td>\n      <td>${r.supervisor||\"\\u2013\"}<\/td>\n      <td>${r.faktur}<\/td>\n      <td>${fmtDateShort(r.tglBarcode)}<\/td>`;\n    tbody.appendChild(tr);\n  });\n\n  document.querySelectorAll('#followupTable th[data-key]').forEach(th => {\n    th.classList.toggle('sorted', th.dataset.key === followupSortKey);\n    th.querySelector('.arrow')?.remove();\n    if (th.dataset.key === followupSortKey) {\n      const span = document.createElement('span');\n      span.className = 'arrow';\n      span.textContent = followupSortDir === 'asc' ? '\\u25B2' : '\\u25BC';\n      th.appendChild(span);\n    }\n  });\n}\n\ndocument.getElementById('followupSearch').addEventListener('input', (e) => {\n  followupSearchTerm = e.target.value.trim().toLowerCase();\n  renderFollowupTab();\n});\ndocument.getElementById('followupLeasingFilter').addEventListener('change', (e) => {\n  followupLeasingValue = e.target.value;\n  renderFollowupTab();\n});\ndocument.querySelectorAll('#followupStatusSeg .seg-btn').forEach(btn => {\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('#followupStatusSeg .seg-btn').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    followupStatus = btn.dataset.status;\n    renderFollowupTab();\n  });\n});\ndocument.querySelectorAll('#followupTable th[data-key]').forEach(th => {\n  th.addEventListener('click', () => {\n    const key = th.dataset.key;\n    if (followupSortKey === key) {\n      followupSortDir = followupSortDir === 'asc' ? 'desc' : 'asc';\n    } else {\n      followupSortKey = key;\n      followupSortDir = 'asc';\n    }\n    renderFollowupTab();\n  });\n});\n\n/* ================= Prioritas Penagihan (di dalam Follow-up Leasing) + riwayat catatan/tugas ================= */\n/* ============ SINKRON ANTAR-PERANGKAT (isi dua baris ini setelah Apps Script di-deploy) ============ */\nconst SYNC_URL = \"https://script.google.com/macros/s/AKfycbxXC24jfCbbG8gfjE1WBB5pFhR1mctX2xzENis6I9IIn98PWQ2RVxJshxHBsq9OJPb0/exec\";   // contoh: \"https://script.google.com/macros/s/XXXXXXXX/exec\"\nconst SYNC_KEY = \"pp-Fnf_3aQWRDr1AtzjBjfS\";   // sudah sama dengan SYNC_KEY di apps_script_sinkron_catatan.gs\n/* ===== Aturan penggabungan catatan/tugas (SAMA persis di dashboard dan di Apps Script) ===== */\nfunction ppMergeRec(a, b) {\n  a = a || {}; b = b || {};\n  const out = { nama: a.nama || b.nama || '', jumlah: a.jumlah || b.jumlah || 0, leasing: a.leasing || b.leasing || '', jto: a.jto || b.jto || '' };\n  out.delAt = [a.delAt, b.delAt].filter(Boolean).sort().pop() || null;             // hapus-riwayat: yang terbaru menang\n  const pick = (b.lu || '') > (a.lu || '') ? b : a;                                  // status lunas: perubahan terbaru menang\n  out.lunasAt = pick.lunasAt || null; out.lu = pick.lu || null;\n  const notes = {};                                                                  // catatan: gabungan semua perangkat (hanya bertambah)\n  [a, b].forEach(r => (r.notes || []).forEach(n => { const id = n.id || ('L' + (n.t || '') + '|' + n.x); notes[id] = Object.assign({}, n, { id: id }); }));\n  out.notes = Object.keys(notes).map(k => notes[k]).filter(n => !out.delAt || (n.t && n.t > out.delAt))\n    .sort((p, q) => String(p.t || '').localeCompare(String(q.t || '')));\n  const tasks = {};                                                                  // tugas: versi dengan waktu ubah terbaru menang\n  [a, b].forEach(r => (r.tasks || []).forEach(t => { const p = tasks[t.id]; if (!p || (t.u || t.t || '') > (p.u || p.t || '')) tasks[t.id] = t; }));\n  out.tasks = Object.keys(tasks).map(k => tasks[k]).filter(t => !out.delAt || (t.t && t.t > out.delAt));\n  return out;\n}\nconst FU_KEY = 'follow_piutang_v1_' + TARGET_DIVISI;   // dipisah per divisi\nconst OLD_CAT = 'catatan_piutang_';\nlet fuDB = {};\ntry { fuDB = JSON.parse(localStorage.getItem(FU_KEY) || '{}') || {}; } catch (e) { fuDB = {}; }\ntry { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}\nfunction fuSaveLocal() { try { localStorage.setItem(FU_KEY, JSON.stringify(fuDB)); } catch (e) {} }\nfunction fuSave() {\n  fuSaveLocal();\n  if (SYNC_URL) { fuPending = true; clearTimeout(fuTimer); fuTimer = setTimeout(fuSyncRemote, 1200); }\n}\nconst fuOpen = new Set();\nlet fuArchOpen = false, fuLive = false;\nconst fuNow = () => new Date().toISOString();\nfunction fuFmt(iso) {\n  if (!iso) return 'Catatan lama';\n  const d = new Date(iso), p = n => String(n).padStart(2, '0');\n  const mon = [\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"Mei\",\"Jun\",\"Jul\",\"Agu\",\"Sep\",\"Okt\",\"Nov\",\"Des\"][d.getMonth()];\n  return `${d.getDate()} ${mon}${d.getFullYear() !== today.getFullYear() ? ' ' + d.getFullYear() : ''} ${p(d.getHours())}.${p(d.getMinutes())}`;\n}\nfunction fuRec(r, create) {\n  let x = fuDB[r.faktur];\n  if (!x) {\n    let old = ''; try { old = localStorage.getItem(OLD_CAT + r.faktur) || ''; } catch (e) {}\n    if (!create && !old) return null;\n    x = fuDB[r.faktur] = { notes: old ? [{ id: 'old:' + r.faktur, t: null, x: old }] : [], tasks: [], lunasAt: null };\n  }\n  x.nama = r.nama; x.jumlah = r.jumlah; x.leasing = r.leasing; x.jto = r.tglJto;\n  return x;\n}\n// Faktur yang punya riwayat lalu hilang dari Sheet1 (data live berhasil dimuat) = dianggap lunas -> diarsipkan\nfunction fuSyncLunas() {\n  if (!fuLive) return;\n  const cur = new Set(rows.map(r => r.faktur));\n  let ch = false;\n  Object.entries(fuDB).forEach(([f, x]) => {\n    if (!cur.has(f) && !x.lunasAt && !x.delAt) { x.lunasAt = fuNow(); x.lu = x.lunasAt; ch = true; }\n    else if (cur.has(f) && x.lunasAt) { x.lunasAt = null; x.lu = fuNow(); ch = true; }\n  });\n  if (ch) fuSave();\n}\nconst fuNotes = x => (x.notes || []).slice().reverse().map(n => `<li><small>${fuFmt(n.t)}<\/small><div>${esc(n.x)}<\/div><\/li>`).join('') || '<li class=\"z\">Belum ada catatan.<\/li>';\n\nfunction fuDetail(r) {\n  const x = fuRec(r, false) || { notes: [], tasks: [] }, f = esc(r.faktur);\n  const tasks = x.tasks.filter(t => !t.del).map(t => `<li class=\"${t.done ? 'done' : ''}\"><label><input type=\"checkbox\" data-a=\"tg\" data-f=\"${f}\" data-i=\"${t.id}\" ${t.done ? 'checked' : ''}> <span>${esc(t.x)}<\/span><\/label><button class=\"fu-x\" title=\"Hapus tugas\" data-a=\"td\" data-f=\"${f}\" data-i=\"${t.id}\">&times;<\/button><div><small>PIC: ${esc(t.pic || '-')}${t.done && t.doneAt ? ' &middot; selesai ' + fuFmt(t.doneAt) : ''}<\/small><\/div><\/li>`).join('') || '<li class=\"z\">Belum ada tugas.<\/li>';\n  const pic = esc((r.salesman || '').split(' ')[0]);\n  return `<div class=\"pr-grid\">\n    <div><h4>CATATAN &mdash; ${f}<\/h4><ul class=\"fu-list\">${fuNotes(x)}<\/ul>\n      <div class=\"fu-form\"><textarea class=\"fu-in\" data-k=\"note\" rows=\"2\" placeholder=\"Tulis catatan follow-up...\"><\/textarea><button class=\"fu-btn\" data-a=\"note\" data-f=\"${f}\">Kirim<\/button><\/div><\/div>\n    <div><h4>TUGAS TERKAIT FAKTUR INI<\/h4><ul class=\"fu-list\">${tasks}<\/ul>\n      <div class=\"fu-form\"><input class=\"fu-in\" data-k=\"task\" placeholder=\"Tugas... (mis. telepon debitur)\"><input class=\"fu-in pic\" data-k=\"pic\" value=\"${pic}\" title=\"PIC\"><button class=\"fu-btn\" data-a=\"task\" data-f=\"${f}\">+ Tugas<\/button><\/div><\/div>\n  <\/div>`;\n}\n\n/* ---------- Sinkron catatan & tugas ke server (Google Apps Script) ---------- */\nlet fuPending = SYNC_URL ? true : false, fuSyncing = false, fuTimer = null, fuSyncState = SYNC_URL ? 'busy' : 'off', fuLastOk = null;\nconst fuUid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);\nfunction fuNormalize() {\n  Object.values(fuDB).forEach(x => {\n    x.notes = (x.notes || []).map(n => n.id ? n : Object.assign({}, n, { id: 'L' + (n.t || '') + '|' + n.x }));\n    x.tasks = (x.tasks || []).map(t => t.u ? t : Object.assign({}, t, { u: t.doneAt || t.t || '' }));\n    if (x.lunasAt && !x.lu) x.lu = x.lunasAt;\n  });\n}\nfuNormalize();\nfunction fuStatusHtml() {\n  const hm = d => String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0');\n  if (fuSyncState === 'off') return '<span class=\"fu-sync off\" title=\"Isi SYNC_URL dan SYNC_KEY di bagian atas file agar catatan tersinkron antar-perangkat\">Sinkron antar-perangkat belum aktif &middot; data hanya di perangkat ini<\/span>';\n  if (fuSyncState === 'busy') return '<span class=\"fu-sync\">Menyinkronkan&hellip;<\/span>';\n  if (fuSyncState === 'err') return '<span class=\"fu-sync err\">&#9888; Gagal sinkron &middot; tersimpan di perangkat ini, dicoba lagi otomatis<\/span>';\n  return '<span class=\"fu-sync ok\">&#10003; Tersinkron ' + hm(fuLastOk) + '<\/span>';\n}\nfunction fuSetStatus(s) {\n  fuSyncState = s;\n  const el = document.getElementById('fuSyncStatus');\n  if (el) el.innerHTML = fuStatusHtml();\n}\nfunction fuMergeInto(remote) {\n  Object.keys(remote || {}).forEach(f => { fuDB[f] = ppMergeRec(fuDB[f], remote[f]); });\n  fuNormalize();\n}\nasync function fuSyncRemote() {\n  if (!SYNC_URL) { fuSetStatus('off'); return; }\n  if (fuSyncing) return;\n  fuSyncing = true;\n  const sent = fuPending;\n  fuPending = false;\n  fuSetStatus('busy');\n  try {\n    const res = await fetch(SYNC_URL, { method: 'POST', body: JSON.stringify({ divisi: TARGET_DIVISI, key: SYNC_KEY, db: sent ? fuDB : {} }) });\n    const j = await res.json();\n    if (!j.ok) throw new Error(j.error || 'ditolak server');\n    fuMergeInto(j.db);\n    fuSaveLocal();\n    fuSyncLunas();           // status lunas dihitung dari data live di perangkat ini\n    fuLastOk = new Date();\n    fuSetStatus('ok');\n    renderPrioritasTab();\n  } catch (err) {\n    console.error('sinkron catatan', err);\n    if (sent) fuPending = true;\n    fuSetStatus('err');\n  }\n  fuSyncing = false;\n  if (fuPending) { clearTimeout(fuTimer); fuTimer = setTimeout(fuSyncRemote, 1500); }\n}\nif (SYNC_URL) {\n  fuSyncRemote();\n  setInterval(() => { if (document.visibilityState === 'visible') fuSyncRemote(); }, 30000);\n  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') fuSyncRemote(); });\n}\n\nfunction fuFmtFull(iso) {\n  if (!iso) return '-';\n  const d = new Date(iso), p = n => String(n).padStart(2, '0');\n  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;\n}\nconst fuIsoDMY = s => { const m = String(s || '').match(/^(\\d{4})-(\\d{2})-(\\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || '-'); };\nconst fuHasNotes = () => Object.values(fuDB).some(x => (x.notes || []).length);\n\n// Rekap seluruh riwayat catatan (dan tugas) per faktur — aktif maupun yang sudah lunas\nfunction fuRecap() {\n  const cur = {}; rows.forEach(r => { cur[r.faktur] = r; });\n  const recs = Object.entries(fuDB).filter(([, x]) => (x.notes || []).length || (x.tasks || []).some(t => !t.del))\n    .sort((a, b) => String(a[1].nama || '').localeCompare(String(b[1].nama || '')) || a[0].localeCompare(b[0]));\n  const status = x => x.lunasAt ? 'Lunas (' + fuFmtFull(x.lunasAt).slice(0, 10) + ')' : 'Belum lunas';\n  const notes = [], tasks = [];\n  recs.forEach(([f, x]) => {\n    const umur = !x.lunasAt && cur[f] ? cur[f].hari + ' hr' : '-';\n    (x.notes || []).slice().sort((a, b) => String(a.t).localeCompare(String(b.t))).forEach(n => {\n      notes.push([notes.length + 1, n.t ? fuFmtFull(n.t) : 'Catatan lama', x.nama || '-', f, fmtMoney(x.jumlah || 0), fuIsoDMY(x.jto), umur, status(x), n.x]);\n    });\n    (x.tasks || []).filter(t => !t.del).forEach(t => {\n      tasks.push([tasks.length + 1, x.nama || '-', f, t.x, t.pic || '-', t.done ? 'Selesai' : 'Belum selesai', fuFmtFull(t.t), t.done ? fuFmtFull(t.doneAt) : '-']);\n    });\n  });\n  return {\n    noteHead: ['No', 'Waktu Catatan', 'Debitur', 'No. Faktur', 'Jumlah (Rp)', 'Jatuh Tempo', 'Umur', 'Status', 'Catatan'],\n    taskHead: ['No', 'Debitur', 'No. Faktur', 'Tugas', 'PIC', 'Status', 'Dibuat', 'Selesai'],\n    notes, tasks,\n  };\n}\nfunction fuFileName(ext) { return `Riwayat_Catatan_Penagihan_${TARGET_DIVISI.replace(/ /g, '_')}_${fuNow().slice(0, 10)}.${ext}`; }\nfunction fuExportExcel() {\n  if (typeof XLSX === 'undefined') { alert('Library Excel belum termuat — pastikan koneksi internet aktif, lalu coba lagi.'); return; }\n  const rc = fuRecap();\n  if (!rc.notes.length) return;\n  const wb = XLSX.utils.book_new();\n  const top = [['Riwayat Catatan Penagihan — ' + TARGET_DIVISI], [(REPORT_DATE_LABEL ? REPORT_DATE_LABEL + ' · ' : '') + 'dicetak ' + fuFmtFull(fuNow())], []];\n  const ws = XLSX.utils.aoa_to_sheet(top.concat([rc.noteHead], rc.notes));\n  ws['!cols'] = [6, 17, 28, 22, 16, 13, 9, 18, 70].map(w => ({ wch: w }));\n  XLSX.utils.book_append_sheet(wb, ws, 'Riwayat Catatan');\n  if (rc.tasks.length) {\n    const wt = XLSX.utils.aoa_to_sheet(top.concat([rc.taskHead], rc.tasks));\n    wt['!cols'] = [6, 28, 22, 45, 14, 15, 17, 17].map(w => ({ wch: w }));\n    XLSX.utils.book_append_sheet(wb, wt, 'Tugas');\n  }\n  XLSX.writeFile(wb, fuFileName('xlsx'));\n}\nfunction fuExportPdf() {\n  if (!window.jspdf) { alert('Library PDF belum termuat — pastikan koneksi internet aktif, lalu coba lagi.'); return; }\n  const rc = fuRecap();\n  if (!rc.notes.length) return;\n  const doc = new window.jspdf.jsPDF({ orientation: 'landscape' });\n  doc.setFontSize(14); doc.text('Riwayat Catatan Penagihan — ' + TARGET_DIVISI, 14, 15);\n  doc.setFontSize(9); doc.text((REPORT_DATE_LABEL ? REPORT_DATE_LABEL + ' · ' : '') + 'dicetak ' + fuFmtFull(fuNow()), 14, 21);\n  doc.autoTable({\n    head: [rc.noteHead], body: rc.notes, startY: 26, styles: { fontSize: 7.5, cellPadding: 1.6, overflow: 'linebreak' },\n    headStyles: { fillColor: [45, 55, 72] }, rowPageBreak: 'avoid',\n    columnStyles: { 0: { cellWidth: 8 }, 1: { cellWidth: 26 }, 4: { halign: 'right', cellWidth: 25 }, 5: { cellWidth: 20 }, 6: { cellWidth: 14 }, 7: { cellWidth: 24 }, 8: { cellWidth: 'auto' } },\n  });\n  if (rc.tasks.length) {\n    let y = doc.lastAutoTable.finalY + 10;\n    if (y > 180) { doc.addPage(); y = 15; }\n    doc.setFontSize(11); doc.text('Tugas terkait faktur', 14, y);\n    doc.autoTable({ head: [rc.taskHead], body: rc.tasks, startY: y + 3, styles: { fontSize: 7.5, cellPadding: 1.6 }, headStyles: { fillColor: [45, 55, 72] }, rowPageBreak: 'avoid' });\n  }\n  doc.save(fuFileName('pdf'));\n}\n\n\n/* ---------------- Prioritas Penagihan: filter Leasing / Cabang / Supervisor + urut kolom (klik judul) ---------------- */\nconst prState = { key: 'hari', dir: 'desc', leasing: '', cabang: '', spv: '' };\nfunction prLeasing(r) { return (r.leasing && r.leasing !== '-') ? r.leasing : (r.cara === 'Tunai' ? 'Cash' : '-'); }\nfunction prSpv(r) { return r.supervisor || '\\u2013'; }\nfunction prVal(r, k) {\n  switch (k) {\n    case 'name': return r.nama || '';\n    case 'faktur': return r.faktur || '';\n    case 'cabang': return TARGET_DIVISI;\n    case 'metode': return r.cara || '';\n    case 'leasing': return prLeasing(r);\n    case 'jumlah': return Number(r.jumlah) || 0;\n    case 'jto': case 'no': return -(r.hari ?? 0);\n    case 'hari': return r.hari ?? 0;\n    case 'sales': return r.salesman || '';\n    case 'spv': return prSpv(r);\n  }\n  return '';\n}\nfunction prMatch(r) {\n  return (!prState.leasing || prLeasing(r) === prState.leasing) &&\n         (!prState.cabang || TARGET_DIVISI === prState.cabang) &&\n         (!prState.spv || prSpv(r) === prState.spv);\n}\nfunction prSort(list) {\n  const dir = prState.dir === 'asc' ? 1 : -1, k = prState.key;\n  return list.slice().sort((a, b) => {\n    const va = prVal(a, k), vb = prVal(b, k);\n    let c = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb), 'id', { numeric: true, sensitivity: 'base' });\n    if (c === 0) c = (b.hari ?? 0) - (a.hari ?? 0);\n    return c * dir;\n  });\n}\nfunction prFixFilters(all) {\n  const has = (fn, v) => all.some(r => fn(r) === v);\n  if (prState.leasing && !has(prLeasing, prState.leasing)) prState.leasing = '';\n  if (prState.spv && !has(prSpv, prState.spv)) prState.spv = '';\n  if (prState.cabang && prState.cabang !== TARGET_DIVISI) prState.cabang = '';\n}\nfunction prBar(all, list) {\n  const uniq = fn => Array.from(new Set(all.map(fn))).sort((a, b) => String(a).localeCompare(String(b), 'id', { numeric: true }));\n  const sel = (k, label, vals, cur) => `<select data-pf=\"${k}\" title=\"Filter ${label}\"><option value=\"\">Semua ${label}<\/option>${vals.map(v => `<option value=\"${esc(v)}\"${v === cur ? ' selected' : ''}>${esc(v)}<\/option>`).join('')}<\/select>`;\n  return `<div class=\"pr-filters\">${sel('leasing', 'Leasing', uniq(prLeasing), prState.leasing)}${sel('cabang', 'Cabang', [TARGET_DIVISI], prState.cabang)}${sel('spv', 'Supervisor', uniq(prSpv), prState.spv)}<button type=\"button\" class=\"pf-reset\">Reset filter<\/button><span class=\"pf-count\">${list.length} dari ${all.length} faktur<\/span><\/div>`;\n}\nfunction prTh(k, label, cls) {\n  const on = prState.key === k;\n  return `<th${cls ? ` class=\"${cls}\"` : ''} data-sort=\"${k}\">${label}<span class=\"sa${on ? ' on' : ''}\">${on ? (prState.dir === 'asc' ? '\\u25B2' : '\\u25BC') : '\\u21C5'}<\/span><\/th>`;\n}\n(function () {\n  const box = document.getElementById('prioritasBox');\n  if (!box) return;\n  box.addEventListener('change', e => {\n    const k = e.target && e.target.dataset && e.target.dataset.pf;\n    if (!k) return;\n    prState[k] = e.target.value; renderPrioritasTab(true);\n  });\n  box.addEventListener('click', e => {\n    if (e.target.closest('.pf-reset')) { prState.leasing = prState.cabang = prState.spv = ''; renderPrioritasTab(true); return; }\n    const th = e.target.closest('th[data-sort]');\n    if (!th) return;\n    const k = th.dataset.sort;\n    if (prState.key === k) prState.dir = prState.dir === 'asc' ? 'desc' : 'asc';\n    else { prState.key = k; prState.dir = (k === 'jumlah' || k === 'hari') ? 'desc' : 'asc'; }\n    renderPrioritasTab(true);\n  });\n})();\n\nfunction renderPrioritasTab(force) {\n  const box = document.getElementById('prioritasBox');\n  if (!box) return;\n  // jangan timpa ketikan yang sedang berlangsung saat sinkronisasi otomatis\n  if (!force && [...box.querySelectorAll('.fu-in')].some(i => i === document.activeElement || (i.dataset.k !== 'pic' && i.value))) return;\n  const allP = rows.filter(r => (r.hari ?? -9999) > 15);\n  prFixFilters(allP);\n  const list = prSort(allP.filter(prMatch));\n  const total = list.reduce((s, r) => s + (Number(r.jumlah) || 0), 0);\n  const debs = new Set(list.map(r => r.nama)).size;\n  let h = `<div class=\"pr-head\"><h3>Pr '.fu-form'), r = rowOf(f);\n        if (!r) return;\n        if (a === 'note') {\n          const v = scope.querySelector('[data-k=\"note\"]').value.trim(); if (!v) return;\n          fuRec(r, true).notes.push({ id: fuUid(), t: fuNow(), x: v });\n        } else {\n          const v = scope.querySelector('[data-k=\"task\"]').value.trim(); if (!v) return;\n          fuRec(r, true).tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), x: v, pic: scope.querySelector('[data-k=\"pic\"]').value.trim(), done: false, t: fuNow(), u: fuNow() });\n        }\n        fuSave(); renderPrioritasTab(true);\n      } else if (a === 'td') {\n        const x = fuDB[f], t = x && x.tasks.find(t => t.id === b.dataset.i); if (t) { t.del = true; t.u = fuNow(); fuSave(); renderPrioritasTab(true); }\n      } else if (a === 'del') {\n        if (confirm('Hapus seluruh riwayat faktur ' + f + '?')) { const x = fuDB[f] || {}; fuDB[f] = { nama: x.nama, jumlah: x.jumlah, leasing: x.leasing, jto: x.jto, delAt: fuNow(), notes: [], tasks: [], lunasAt: x.lunasAt || null, lu: x.lu || null }; fuSave(); renderPrioritasTab(true); }\n      } else if (a === 'arch') { fuArchOpen = !fuArchOpen; renderPrioritasTab(true); }\n      else if (a === 'xpdf') fuExportPdf();\n      else if (a === 'xxls') fuExportExcel();\n      return;\n    }\n    if (e.target.closest('.pr-detail')) return;\n    const tr = e.target.closest('.pr-row');\n    if (tr) { const f = tr.dataset.f; fuOpen.has(f) ? fuOpen.delete(f) : fuOpen.add(f); renderPrioritasTab(true); }\n  });\n  box.addEventListener('change', e => {\n    const c = e.target.closest('input[data-a=\"tg\"]');\n    if (!c) return;\n    const x = fuDB[c.dataset.f], t = x && x.tasks.find(t => t.id === c.dataset.i);\n    if (t) { t.done = c.checked; t.doneAt = c.checked ? fuNow() : null; t.u = fuNow(); fuSave(); renderPrioritasTab(true); }\n  });\n})();\n\n/* ================= Penjualan: ringkasan 3 cabang x 3 bulan + tab Detail ================= */\nlet SALES_DATE_FMT = \"DMY\";\nconst CAB = [[\"Gatsu\",\"#2F4FD0\"],[\"Flamboyan\",\"#C2410C\"],[\"Gagak Hitam\",\"#0F766E\"]];\nconst BLN = [\"Januari\",\"Februari\",\"Maret\",\"April\",\"Mei\",\"Juni\",\"Juli\",\"Agustus\",\"September\",\"Oktober\",\"November\",\"Desember\"];\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n\nfunction months() {\n  const a = [];\n  for (let i = 2; i >= 0; i--) {\n    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);\n    a.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));\n  }\n  return a;\n}\nconst monName = (m, full) => { const n = BLN[+m.slice(5) - 1]; return full ? n : n.slice(0, 3); };\nfunction periodLabel() { const M = months(); return monName(M[0]) + '\\u2013' + monName(M[2]) + ' ' + M[2].slice(0, 4); }\nconst inPeriod = r => months().includes((r.tanggal || '').slice(0, 7));\n\nfunction monthsN(n) {\n  const a = [];\n  for (let i = n - 1; i >= 0; i--) {\n    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);\n    a.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));\n  }\n  return a;\n}\nconst triState = {}, triDefs = {};\nconst shortMon = m => monName(m) + ' ' + m.slice(2, 4);\nfunction rangeLabel(M, sel) {\n  if (!sel.length) return 'belum ada bulan dipilih';\n  if (sel.length === 1) return monName(sel[0], true) + ' ' + sel[0].slice(0, 4);\n  const idx = sel.map(m => M.indexOf(m));\n  if (idx.every((v, i) => i === 0 || v === idx[i - 1] + 1)) {\n    const a = sel[0], z = sel[sel.length - 1];\n    return monName(a) + (a.slice(0, 4) !== z.slice(0, 4) ? ' ' + a.slice(0, 4) : '') + '\\u2013' + monName(z) + ' ' + z.slice(0, 4);\n  }\n  return sel.map(shortMon).join(', ');\n}\n\nfunction renderTri(elId, title, keyFn, colLabel) {\n  triDefs[elId] = [title, keyFn, colLabel];\n  const st = triState[elId] || (triState[elId] = { n: 3, of les'].forEach(id => {\n  const box = $(id);\n  box.addEventListener('change', e => {\n    const s = e.target.closest('select[data-e]');\n    if (!s) return;\n    triState[id] = { n: +s.value, off: new Set() };\n    renderTri(id, ...triDefs[id]);\n  });\n  box.addEventListener('click', e => {\n    const b = e.target.closest('.tri-chip');\n    if (!b) return;\n    const st = triState[id], m = b.dataset.m;\n    if (m === '*') st.off = new Set(); else if (st.off.has(m)) st.off.delete(m); else st.off.add(m);\n    renderTri(id, ...triDefs[id]);\n  });\n});\n\nconst dS = { k: 'tanggal', d: -1 };\nconst dCol = new Set();\nlet dNames = [];\nconst DCOLS = [['nama','Nama Debitur'],['tanggal','Tanggal'],['namabrg','Tipe Unit'],['leasing','Leasing'],['asuransi','Insurance'],['salesman','Salesman'],['supervisor','Supervisor']];\n\nfunction fillDetailFilters() {\n  const monSel = $('dMonth'), mv = monSel.value;\n  monSel.innerHTML = `<option value=\"all\">3 bulan (${periodLabel()})<\/option>` + months().map(m => `<option value=\"${m}\">${monName(m, true)} ${m.slice(0, 4)}<\/option>`).join('');\n  if ([...monSel.options].some(o => o.value === mv)) monSel.value = mv;\n}\n\nfunction renderDetail() {\n  const mo = $('dMonth').value, g = $('dGroup').value, q = $('dSearch').value.trim().toLowerCase();\n  const list = SALES.filter(r => inPeriod(r) && r.divisi === TARGET_DIVISI && (mo === 'all' || r.tanggal.slice(0, 7) === mo) &&\n    (!q || (r.nama + ' ' + r.namabrg + ' ' + r.salesman + ' ' + r.faktur).toLowerCase().includes(q)));\n  const cmp = (a, b) => {\n    let c = String(a[dS.k] || '').localeCompare(String(b[dS.k] || '')) * dS.d;\n    return c || b.tanggal.localeCompare(a.tanggal);\n  };\n  const map = new Map();\n  list.forEach(r => { const k = r[g] || '-'; if (!map.has(k)) map.set(k, []); map.get(k).push(r); });\n  const groups = [...map.entries()].sort((a, b) => b[1].length - a[1].length);\n  dNames = groups.map(g => g[0]);\n  $('dInfo').textContent = `${list.length} unit \\u00B7 ${TARGET_DIVISI} \\u00B7 ${mo === 'all' ? periodLabel() : monName(mo, true) + ' ' + mo.slice(0, 4)}`;\n  const arrow = k => dS.k === k ? `<span class=\"arrow\">${dS.d > 0 ? '\\u25B2' : '\\u25BC'}<\/span>` : '';\n  const head = '<th>No<\/th>' + DCOLS.map(([k, l]) => `<th class=\"sortable\" data-k=\"${k}\">${l}${arrow(k)}<\/th>`).join('');\n  $('detailSections').innerHTML = groups.length ? groups.map(([name, items]) => `\n    <div class=\"leasing-section\">\n      <div class=\"leasing-head dtoggle\" data-g=\"${esc(name)}\" title=\"Klik untuk minimize / buka\"><span class=\"chev\">${dCol.has(name) ? '\\u25B8' : '\\u25BE'}<\/span><span class=\"name\">${esc(name)}<\/span><span class=\"meta\">${items.length} unit<\/span><\/div>\n      <div class=\"leasing-table-scroll\"${dCol.has(name) ? ' hidden' : ''}><table class=\"detail\"><thead><tr>${head}<\/tr><\/thead><tbody>\n      ${items.slice().sort(cmp).map((r, i) => `<tr><td class=\"num\">${i + 1}<\/td><td class=\"nama\">${esc(r.nama)}<\/td><td>${fmtDateShort(r.tanggal)}<\/td><td>${esc(r.namabrg || '\\u2013')}<\/td><td>${esc(r.leasing)}<\/td><td>${esc(r.asuransi)}<\/td><td>${esc(r.salesman || '\\u2013')}<\/td><td>${esc(r.supervisor || '\\u2013')}<\/td><\/tr>`).join('')}\n      <\/tbody><\/table><\/div><\/div>`).join('')\n    : '<p style=\"color:var(--muted);padding:16px 0;\">Tidak ada data penjualan untuk filter ini.<\/p>';\n}\n$('detailSections').addEventListener('click', e => {\n  const tg = e.target.closest('.dtoggle');\n  if (tg) { const g = tg.dataset.g; dCol.has(g) ? dCol.delete(g) : dCol.add(g); renderDetail(); return; }\n  const th = e.target.closest('th[data-k]');\n  if (!th) return;\n  const k = th.dataset.k;\n  if (dS.k === k) dS.d = -dS.d; else { dS.k = k; dS.d = k === 'tanggal' ? -1 : 1; }\n  renderDetail();\n});\n['dMonth', 'dGroup'].forEach(id => $(id).addEventListener('change', renderDetail));\n$('dSearch').addEventListener('input', renderDetail);\n$('dCollapseAll').addEventListener('click', () => { dNames.forEach(n => dCol.add(n)); renderDetail(); });\n$('dExpandAll').addEventListener('click', () => { dCol.clear(); renderDetail(); });\n\nfunction renderSalesAll() {\n  renderTri('triLeasing', 'Penjualan per Leasing', r => r.leasing, 'Leasing / Metode');\n  renderTri('triAsuransi', 'Penjualan per Insurance Company', r => r.asuransi, 'Insurance Company');\n  renderTri('triSupervisor', 'Penjualan per Supervisor', r => r.supervisor, 'Supervisor');\n  renderTri('triSales', 'Sales Terbanyak', r => r.salesman, 'Salesman');\n  fillDetailFilters();\n  renderDetail();\n}\nfunction applySales(list) { if (list && list.length) { SALES = list; renderSalesAll(); } }\n\n/* ---- Ambil data penjualan dari sheet (tab yang punya header \"Fakturno\") ---- */\nfunction normDate(v) {\n  if (v == null || v === '') return null;\n  if (v instanceof Date) return v.toISOString().slice(0, 10);\n  if (typeof v === 'number') {\n    const d = XLSX.SSF.parse_date_code(v);\n    return d ? `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}` : null;\n  }\n  const s = String(v); let m;\n  if (s.startsWith('Date(')) { const [y, mo, d] = s.slice(5, -1).split(',').map(Number); return `${y}-${String(mo + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }\n  if ((m = /^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})/.exec(s))) { const d = SALES_DATE_FMT === 'MDY' ? m[2] : m[1], mo = SALES_DATE_FMT === 'MDY' ? m[1] : m[2]; return `${m[3]}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }\n  if (/^\\d{4}-\\d{2}-\\d{2}/.test(s)) return s.slice(0, 10);\n  return null;\n}\n// Kolom: B=Tanggal C=Fakturno D=Nama F=Namabrg H=Cara J=Divisi K=Status Fnc(Leasing) L=Salesman(sales) M=Supervisor S=Asuransi\nfunction mapSales(start, end, get) {\n  const nm = v => { v = v == null ? '' : String(v); return (v.includes('=') ? v.slice(v.indexOf('=') + 1) : v).trim(); };\n  const out = [], seen = new Set();\n  for (let r = start; r < end; r++) {\n    const nama = get(r, 3), divisi = get(r, 9), tgl = normDate(get(r, 1));\n    if (!nama || !tgl || divisi !== TARGET_DIVISI) continue;\n    const fk = get(r, 2); if (fk) { if (seen.has(fk)) continue; seen.add(fk); }\n    const asu = get(r, 18);\n    out.push({\n      tanggal: tgl, faktur: get(r, 2), nama: String(nama).trim(), namabrg: get(r, 5), cara: get(r, 7), divisi,\n      leasing: get(r, 10) || '-', salesman: nm(get(r, 11)) || '-', supervisor: String(get(r, 12) || '-').trim(),\n      asuransi: (!asu || asu === '-') ? 'NON ASURANSI' : String(asu).trim(),\n    });\n  }\n  return out;\n}\nfunction findHeader(get, max) {\n  for (let r = 0; r < max; r++) { const v = get(r, 2); if (typeof v === 'string' && v.trim().toLowerCase() === 'fakturno') return r; }\n  return -1;\n}\nfunction extractSalesFromWorkbook(wb) {\n  for (const n of wb.SheetNames) {\n    const ws = wb.Sheets[n]; if (!ws || !ws['!ref']) continue;\n    const rg = XLSX.utils.decode_range(ws['!ref']);\n    const get = (r, c) => { const x = ws[XLSX.utils.encode_cell({ r, c })]; return x ? x.v : undefined; };\n    const h = findHeader(get, Math.min(rg.e.r, 30));\n    if (h >= 0) return mapSales(h + 1, rg.e.r + 1, get);\n  }\n  return null;\n}\nrender();\nrenderLeasingTab();\nrenderFollowupTab();\nrenderPrioritasTab();\nrenderSalesAll();\ndocument.getElementById('sourceCount').textContent = rows.length;\n\n/* ================= Live sync dari Google Sheet (tiap 30 detik) ================= */\nconst FILE_ID = \"1ul2WqwEb4X66Q6CYdycNvtyaLu08axFkZL75FI-qdmM\";\nconst XLSX_MIME = \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\";\nconst KNOWN_DIVISI = [\"Gatsu\", \"Flamboyan\", \"Gagak Hitam\"];\nconst syncRowEl = document.getElementById('syncRow');\nconst syncTextEl = document.getElementById('syncText');\nlet lastSyncedLabel = null; // tanggal-jam refresh terakhir yang BERHASIL, tetap tampil walau status berubah\n\nfunction setSync(state, message) {\n  syncRowEl.className = 'sync-row ' + state;\n  const suffix = (lastSyncedLabel && state !== 'live')\n    ? ` &middot;  otomatis tiap 2 menit`);\n}\n\n/* ---------- Sinkronisasi live: CSV \"Publish to web\" (cara baca sama dengan dashboard gabungan) ---------- */\nconst PUB_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8rWnYng7TGqvAMl7aryX7yZE7hQnzwF3Urqwu1t8bPq9AFJBXPfqaGmUzTk08Nw91e6mQGV6kbc2J/pub';\nconst PIUTANG_CSV_URL = PUB_BASE + '?gid=860325626&single=true&output=csv'; // tab Sheet1 (piutang)\nconst SALES_CSV_URL = PUB_BASE + '?gid=0&single=true&output=csv';           // tab Data (penjualan)\nconst SYNC_MS = 120000; // 2 menit\n\n/* ===== Sheet \"Data PerFaktur\": Tgl Buat Tagihan & Tgl Barcode dibaca per Faktur No. (bukan dari kolom O/P Sheet1) ===== */\nconst PERFAKTUR_SHEETS = ['Data Per Faktur', 'Data PerFaktur'];\nconst PERFAKTUR_FILE_ID = '1ul2WqwEb4X66Q6CYdycNvtyaLu08axFkZL75FI-qdmM';\nconst PERFAKTUR_PUB_GID = ''; // opsional: isi angka gid sheet \"Data PerFaktur\" (dari alamat #gid=...) bila file Google Sheet tidak dibagikan \"Siapa saja yang memiliki link\" tetapi sudah di-publish ke web\n/* ===== Sheet \"Data\": Type, Divisi, Cara Pembelian, Leasing, Salesman, Supervisor dicocokkan per Faktur No. (bukan dari Sheet1) ===== */\nlet dsLast = null;\nfunction dsDivisi(r) { let d = String(r[9] == null ? '' : r[9]).trim(); if (!d) { const raw = String(r[8] == null ? '' : r[8]).trim(); if (raw) d = raw.replace(/\\s+mobil$/i, ''); } return d; }\nfunction dsTxt(v) { return pfClean(v); }\nfunction buildDataLookup(rows) {\n  let h = -1;\n  for (let i = 0; i < rows.length && i < 40; i++) { const r = rows[i]; if (r && String(r[0]).trim() === 'No' && String(r[1]).trim() === 'Tanggal') { h = i; break; } }\n  if (h < 0) return null;\n  const map = {}; let n = 0;\n  for (let i = h + 1; i < rows.length; i++) {\n    const r = rows[i], k = pfKey(r && r[2]);\n    if (!k) continue;\n    map[k] = { type: dsTxt(r[5]), cara: dsTxt(r[7]), divisi: dsDivisi(r), leasing: dsTxt(r[10]), sales: dsTxt(r[11]), spv: dsTxt(r[12]) };\n    n++;\n  }\n  return n ? map : null;\n}\nasync function fetchDataLookup() {\n  try { const m = buildDataLookup(await pfFetchRows(SALES_CSV_URL)); if (m) { dsLast = m; return m; } }\n  catch (e) { console.warn('Sheet Data belum terbaca:', e); }\n  return dsLast;\n}\nlet pfLast = null;\nfunction pfKey(v) { return String(v == null ? '' : v).replace(/\\s+/g, ' ').trim().toUpperCase(); }\nfunction pfClean(v) { v = String(v == null ? '' : v).trim(); return /^#(N\\/A|REF!|VALUE!|NAME\\?|DIV\\/0!|NULL!|NUM!|ERROR!)/i.test(v) || /^\\\\?-+$/.test(v) ? '' : v; }\nfunction buildPerFaktur(rows) {\n  for (let i = 0; i < rows.length && i < 15; i++) {\n    const r = rows[i] || [];\n    const hs = r.map(c => String(c == null ? '' : c).toLowerCase().replace(/\\s+/g, ' ').trim());\n    let f = -1, t = -1, b = -1;\n    hs.forEach((s, j) => { if (f < 0 && /faktur/.test(s) && !/tgl|tanggal/.test(s)) f = j; });\n    hs.forEach((s, j) => { if (t < 0 && /tagihan/.test(s) && /tgl|tanggal|buat/.test(s)) t = j; });\n    if (t < 0) hs.forEach((s, j) => { if (t < 0 && /tagihan/.test(s)) t = j; });\n    hs.forEach((s, j) => { if (b < 0 && /bar(c|k)ode/.test(s.replace(/[^a-z]/g, '')) && /tgl|tanggal/.test(s)) b = j; });\n    if (b < 0) hs.forEach((s, j) => { if (b < 0 && /bar(c|k)ode/.test(s.replace(/[^a-z]/g, ''))) b = j; });\n    if (f < 0 || (t < 0 && b < 0)) continue;\n    const map = {}; let n = 0;\n    for (let k = i + 1; k < rows.length; k++) {\n      const row = rows[k], key = pfKey(row && row[f]);\n      if (!key) continue;\n      map[key] = { tagih: t > -1 ? pfClean(row[t]) : '', barcode: b > -1 ? pfClean(row[b]) : '' };\n      n++;\n    }\n    return n ? map : null;\n  }\n  return null;\n}\nasync function pfFetchRows(url) {\n  const res = await fetch(url, { cache: 'no-store' });\n  if (!res.ok) throw new Error('HTTP ' + res.status);\n  const t = await res.text();\n  if (/^\\s*<\/.test(t)) throw new Error('bukan CSV');\n  return parseCSVFull(t.replace(/^\\uFEFF/, ''));\n}\nasync function fetchPerFaktur() {\n  const urls = PERFAKTUR_SHEETS.map(n => 'https://docs.google.com/spreadsheets/d/' + PERFAKTUR_FILE_ID + '/gviz/tq?tqx=out:csv&headers=0&sheet=' + encodeURIComponent(n));\n  if (PERFAKTUR_PUB_GID) urls.push(PUB_BASE + '?gid=' + PERFAKTUR_PUB_GID + '&single=true&output=csv');\n  for (const u of urls) {\n    try { const m = buildPerFaktur(await pfFetchRows(u)); if (m) { pfLast = m; return m; } }\n    catch (e) { console.warn('Data PerFaktur belum terbaca:', e); }\n  }\n  return pfLast; // gagal: pakai data terakhir yang berhasil; bila belum pernah berhasil -> null (cadangan: kolom O/P Sheet1)\n}\n\nfunction detectDelimiter(text) {\n  const lines = text.split(/\\r?\\n/).filter(l => l.trim().length > 0).slice(0, 15);\n  let best = ',', bestMax = 1;\n  for (const d of ['\\t', ',', ';']) {\n    const mx = Math.max(...lines.map(l => l.split(d).length));\n    if (mx > bestMax) { bestMax = mx; best = d; }\n  }\n  return best;\n}\nfunction parseCSVFull(text) {\n  const delim = detectDelimiter(text), out = [];\n  let row = [], field = '', q = false;\n  for (let i = 0; i < text.length; i++) {\n    const c = text[i];\n    if (q) {\n      if (c === '\"') { if (text[i + 1] === '\"') { field += '\"'; i++; } else q = false; }\n      else field += c;\n    } else if (c === '\"') q = true;\n    else if (c === delim) { row.push(field); field = ''; }\n    else if (c === '\\n') { row.push(field); out.push(row); row = []; field = ''; }\n    else if (c !== '\\r') field += c;\n  }\n  if (field.length || row.length) { row.push(field); out.push(row); }\n  return out;\n}\nconst cellStr = v => v == null ? '' : String(v).trim();\nfunction cellNum(v) {\n  if (typeof v === 'number') return v;\n  const n = Number(String(v == null ? '' : v).replace(/[^0-9-]/g, ''));\n  return isNaN(n) ? 0 : n;\n}\n// Deteksi DMY / MDY dari data itu sendiri (angka > 12 pasti hari)\nfunction detectDateFormat(list) {\n  for (const s of list) {\n    const m = String(s || '').match(/^(\\d{1,2})[\\/\\-.](\\d{1,2})[\\/\\-.]\\d{2,4}(?!\\d)/);\n    if (!m)    if (!s || s === \"-\") return null;\n    if (/^\\d{1,3}([.,]\\d{3})+$/.test(s)) return parseInt(s.replace(/[.,]/g, \"\"), 10);   // pemisah ribuan\n    if (/^\\d+[.,]\\d+$/.test(s)) return Math.round(parseFloat(s.replace(\",\", \".\")));       // desimal\n    var n = parseInt(s.replace(/[^\\d]/g, \"\"), 10);\n    return isNaN(n) ? null : n;\n  }\n\n  // Nama salesman di sheet berformat \"KODE=NAMA LENGKAP\"; yang diambil hanya nama lengkap\n  function cleanName(s) {\n    s = String(s == null ? \"\" : s).trim();\n    var i = s.indexOf(\"=\");\n    return i >= 0 ? s.slice(i + 1).trim() : s;\n  }\n\n  // Tanggal: seragamkan menjadi dd/mm/yyyy\n  function normDate(v) {\n    v = String(v == null ? \"\" : v).trim();\n    var m = /^(\\d{1,2})[\\/.\\-](\\d{1,2})[\\/.\\-](\\d{4})/.exec(v);\n    if (m) return (\"0\" + m[1]).slice(-2) + \"/\" + (\"0\" + m[2]).slice(-2) + \"/\" + m[3];\n    m = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(v);\n    return m ? m[3] + \"/\" + m[2] + \"/\" + m[1] : v;\n  }\n  // Kunci urut tanggal: \"dd/mm/yyyy[ hh:mm]\" -> \"yyyymmddhhmm\"\n  function dkey(v) {\n    var m = /^(\\d{2})\\/(\\d{2})\\/(\\d{4})(?: (\\d{2}):(\\d{2}))?/.exec(v || \"\");\n    return m ? m[3] + m[2] + m[1] + (m[4] || \"00\") + (m[5] || \"00\") : \"000000000000\";\n  }\n  // Serah Tanggal: kosong tetap kosong; bila ada isi dipertahankan (tanggal diseragamkan dd/mm/yyyy, jam ikut bila bukan 00:00)\n  function normStamp(v) {\n    v = String(v == null ? \"\" : v).trim();\n    if (!v || v === \"-\") return \"\";\n    var m = /^(\\d{1,2})[\\/.\\-](\\d{1,2})[\\/.\\-](\\d{4})(?:[ T]+(\\d{1,2}):(\\d{2}))?/.exec(v), d, t = \"\";\n    if (m) { d = (\"0\" + m[1]).slice(-2) + \"/\" + (\"0\" + m[2]).slice(-2) + \"/\" + m[3]; }\n    else {\n      m = /^(\\d{4})-(\\d{2})-(\\d{2})(?:[ T]+(\\d{1,2}):(\\d{2}))?/.exec(v);\n      if (!m) return v;\n      d = m[3] + \"/\" + m[2] + \"/\" + m[1];\n    }\n    if (m[4] !== undefined && !(parseInt(m[4], 10) === 0 && parseInt(m[5], 10) === 0)) t = \" \" + (\"0\" + m[4]).slice(-2) + \":\" + m[5];\n    return d + t;\n  }\n\n  // Umur dari kolom \"Hari\" (Y): angka desimal, mis. 35.33 -> 35. Bila sudah angka (jalur xlsx) dipakai langsung;\n  // bila berupa teks (jalur CSV) dibaca dengan num().\n  function hariVal(v) {\n    if (typeof v === \"number\") return isFinite(v) ? Math.round(v) : null;\n    return num(v);\n  }\n\n  // Kolom sheet cabang: B=1 Customer, C=2 STNK a/n, D=3 NoRangka, G=6 No Polisi, I=8 Serah STNK,\n  // J=9 Nomor BPKB, K=10 Terima Tanggal (BPKB), L=11 <60Hr, M=12 >60Hr, N=13 >90Hr, O=14 Leasing,\n  // U=20 Salesman, V=21 Supervisor, X=23 Serah Tanggal, Y=24 Hari\n  // raw = isi sheet yang sama dalam bentuk angka asli (opsional), dipakai untuk membaca kolom Hari\n  // Terima Tanggal BPKB -> waktu (ms, tanpa zona). Angka serial Excel (jalur xlsx) atau teks dd/mm/yyyy[ hh:mm[:ss]] / yyyy-mm-dd[ hh:mm] (jalur CSV).\n  function terimaMs(v) {\n    if (typeof v === \"number\") return isFinite(v) && v > 20000 ? Math.round((v - 25569) * 86400000) : null;\n    var s = String(v == null ? \"\" : v).trim();\n    if (!s || s === \"-\") return null;\n    var m = /^(\\d{1,2})[\\/.\\-](\\d{1,2})[\\/.\\-](\\d{4})(?:[ T]+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?)?/.exec(s);\n    if (m) return Date.UTC(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));\n    m = /^(\\d{4})-(\\d{1,2})-(\\d{1,2})(?:[ T]+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?)?/.exec(s);\n    if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));\n    return null;\n  }\n  // Umur (hari) = hari ini (00:00) dikurangi Terima Tanggal, dibulatkan; kosong bila tanggal tidak ada / tidak terbaca\n  function umurAuto(v) {\n    var ms = terimaMs(v);\n    if (ms == null) return null;\n    var t = new Date();\n    return Math.round((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - ms) / 86400000);\n  }\n\n  // Kolom sheet cabang yang dicari lewat JUDUL (supaya kolom lain boleh dihapus): Leasing, No. Bast, Serah Tanggal (X), dan\n  // (hanya untuk cadangan bila sheet Data tidak terbaca) Salesman + Supervisor hasil VLOOKUP.\n  function bpkbCols(table) {\n    var col = { leasing: 14, bast: 18, serah: 23, sales: -1, spv: -1 };\n    for (var i = 0; i < table.length && i < 20; i++) {\n      var r = table[i] || [];\n      if (String(r[0] == null ? \"\" : r[0]).trim().toLowerCase() !== \"no\" || String(r[1] == null ? \"\" : r[1]).toLowerCase().indexOf(\"customer\") < 0) continue;\n      var h = r.map(function (x) { return String(x == null ? \"\" : x).replace(/\\s+/g, \" \").trim().toLowerCase(); });\n      col = { leasing: -1, bast: -1, serah: -1, sales: -1, spv: -1 };\n      h.forEach(function (t, j) {\n        if (t === \"leasing\") col.leasing = j;\n        else if (t === \"no. bast\" || t === \"no bast\" || t === \"nobast\") col.bast = j;\n        else if (t === \"serah tanggal\" && j > 10) col.serah = j;\n        else if (t === \"supervisor\") col.spv = j;\n      });\n      if (col.spv > 0 && h[col.spv - 1] === \"salesman\") col.sales = col.spv - 1;\n      break;\n    }\n    return col;\n  }\n  function bastKey(v) { return String(v == null ? \"\" : v).replace(/\\s+/g, \" \").trim().toUpperCase(); }\n  // Nama divisi dari sheet Data -> nama divisi dashboard (Gatsu / Gagak Hitam / Flamboyan); tak dikenal -> \"\" (pakai nama sheet cabang)\n  function canonDiv(s) {\n    var l = String(s == null ? \"\" : s).trim().toLowerCase(), i;\n    for (i = 0; i < DIVISIONS.length; i++) if (DIVISIONS[i].toLowerCase() === l) return DIVISIONS[i];\n    if (l.indexOf(\"gatsu\") > -1) return \"Gatsu\";\n    if (l.indexOf(\"gagak\") > -1) return \"Gagak Hitam\";\n    if (l.indexOf(\"flamboyan\") > -1) return \"Flamboyan\";\n    return \"\";\n  }\n  // Sheet \"Data\": satu baris per No. BAST -> Salesman (\"KODE=NAMA LENGKAP\"), Supervisor, Divisi. Kolom dicari lewat judul (cadangan: A, B, C, D).\n  function buildLookup(rows) {\n    if (!rows || !rows.length) return null;\n    var iB = 0, iS = 1, iP = 2, iD = 3,
