<style>
:root{
  --bg:#ffffff; --card:#fff; --soft:#f4f5f7; --ink:#1b2330; --ink2:#4a5568; --muted:#8a93a3; --line:#e6e8ec;
  --accent:#2563eb; --accent-soft:#e8eefc; --bar:#6c8fe0;
  --serif:"Fraunces","Newsreader","Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --c0:#1a9c4a; --c1:#b45309; --c2:#c2410c; --c3:#dc2626; --crit-bg:#fdf1f1; --crit-line:#f5cccc;
  --ok-bg:#e3f4ea; --ok:#176b3a; --warn-bg:#fdf1d6; --warn:#8a5a00; --ser-bg:#fde5d3; --ser:#9a3d00; --bad-bg:#fbdcdc; --bad:#a11d1d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.wrap{max-width:1560px;margin:0 auto;padding:34px 30px 50px}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.top>div:first-child{flex:1 1 260px;min-width:0}
h1{font:600 32px/1.15 var(--serif);margin:0;letter-spacing:-.01em}
.per{color:var(--muted);font-size:15px;margin-top:6px}
.right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:1 1 240px;margin-left:auto;min-width:0;max-width:100%}
.sync{display:flex;align-items:center;gap:12px;justify-content:flex-end;max-width:100%;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14.5px;white-space:nowrap;max-width:100%}
.live b{color:var(--ink);font-weight:600}
.ico{width:30px;height:30px;border-radius:8px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.live.warn .ico{background:#d97706}
.refresh{display:inline-flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:600 17px/1 system-ui,sans-serif;border-radius:14px;padding:11px 22px 11px 14px;cursor:pointer}
.refresh:hover{border-color:var(--accent)}
.refresh:disabled{opacity:.7;cursor:progress}
.spin svg{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.src{color:var(--ink2);font-size:15px;max-width:100%;overflow-wrap:break-word}
/* tabs */
.tabs{display:flex;gap:28px;margin:22px 0 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);font:600 20px/1 var(--serif);padding:10px 2px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font:500 14px var(--mono);color:var(--muted);margin-left:8px}
.cabtabs{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 0}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:500 17px/1 system-ui,sans-serif;padding:15px 26px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:baseline;gap:10px}
.pill .n{color:var(--muted);font-size:17px}
.pill:hover{border-color:var(--ink2)}
.pill[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill[aria-selected=true] .n{color:var(--bg);opacity:.85}
/* summary */
.sum{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin:24px 0 18px}
.hero{border:1px solid var(--line);border-radius:18px;padding:30px 32px;background:linear-gradient(135deg,var(--soft),var(--card));display:flex;flex-direction:column;justify-content:center;min-height:210px}
.hero .l{color:var(--ink2);font-size:17px}
.hero .big{font:500 76px/1.05 var(--serif);margin:16px 0 14px;letter-spacing:-.02em;font-variant-numeric:lining-nums}
.hero .s{color:var(--ink2);font-size:16px}
.hero .s b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bt{justify-content:center;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:20px 22px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.bt:hover{border-color:var(--accent)}
.bt.on{outline:2px solid var(--accent);border-color:var(--accent)}
.bt .h{display:flex;align-items:center;gap:9px;color:var(--ink2);font-size:15.5px}
.bt .d{width:10px;height:10px;border-radius:50%;flex:none}
.bt .v{font:700 27px/1.15 var(--mono);letter-spacing:-.02em}
.bt .c{color:var(--muted);font-size:15px}
.bt.crit{background:var(--crit-bg);border-color:var(--crit-line)}
.bt.crit .v{color:var(--c3)}
/* susunan biro jasa / leasing di kartu total */
.cmp{margin-top:22px}
.cmp .ct{font-size:13px;color:var(--muted);margin-bottom:8px}
.stk{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.stk i{display:block;height:100%;min-width:3px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:14.5px}
.lc{border:0;background:none;font:inherit;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.lc:hover{background:var(--accent-soft)}
.lc.on{outline:2px solid var(--accent);background:var(--accent-soft)}
.lc .d{width:12px;height:12px;border-radius:50%;flex:none}
.lc b{font-family:var(--mono);color:var(--ink);font-size:13.5px}
.lc .pc{color:var(--muted)}
/* filters */
.filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input,.filters select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 220px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.spacer{flex:1}
/* table */
.cnt{color:var(--muted);font-size:12.5px;margin:0 0 6px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--card);z-index:2;text-align:left;padding:10px;border-bottom:2px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;color:var(--ink2);font-weight:600}
th:hover{color:var(--accent)}
th .ar{opacity:.6;margin-left:3px}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
tr:hover td{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
.badge{display:inline-block;padding:1px 8px;border-radius:9px;font-weight:600;font-size:12px;white-space:nowrap}
.b0{background:var(--ok-bg);color:var(--ok)} .b1{background:var(--warn-bg);color:var(--warn)} .b2{background:var(--ser-bg);color:var(--ser)} .b3{background:var(--bad-bg);color:var(--bad)}
.dash{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:1100px){.sum{grid-template-columns:1fr}.right{align-items:flex-start;text-align:left}.sync{justify-content:flex-start}}
@media (max-width:760px){.live{white-space:normal}}
@media (max-width:600px){.wrap{padding:20px 14px}h1{font-size:22px}.per{font-size:13px}.live{font-size:12.5px;white-space:normal}.src{font-size:12.5px}.refresh{padding:9px 16px 9px 12px;font-size:15px}.hero .big{font-size:48px}.bk{grid-template-columns:1fr}}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;color:#000;font-size:10px}
 .tabs,.filters,.btn,.refresh,.sync{display:none!important}
 .pill:not([aria-selected=true]){display:none}
 
 .tw{max-height:none;overflow:visible;border:0} th{position:static} table{width:100%}
 .hero .big{font-size:40px} td,th{padding:3px 5px}
}

.gbtn:hover{background:#e1e9fb}
.gbtn:disabled{opacity:.6;cursor:default}
</style>

function prep(){ setToday(); SOURCES.forEach(s=>s.rows.forEach(r=>{ r.cab=s.cab; r.age=TABS[s.tab].ageOf(r); r.ketn=normKet(r.ket); r.bk=bucketOf(r.age)?.k||''; })); }
const rowsOf = tab => SOURCES.filter(s=>s.tab===tab).flatMap(s=>s.rows);
const fval = (r,k) => k==='ket'? r.ketn : k==='age'? r.bk : r[k];

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; rows.push(row); row=[]; }
    else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function fetchSource(s){
  const base=`https://docs.google.com/spreadsheets/d/${s.id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(s.sheet)}`;
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),25000);
  try{
    const [a,b]=await Promise.all([
      fetch(base+'&range=A7:U999&headers=1',{signal:ctl.signal,cache:'no-store'}),
      fetch(base+'&range=A4:A5&headers=0',{signal:ctl.signal,cache:'no-store'}).catch(()=>null)
    ]);
    if(!a.ok) throw new Error('HTTP '+a.status);
    const grid=parseCSV(await a.text());
    const hi=grid.findIndex((r,i)=>i<4 && (r[0]||'').trim()==='No');
    if(hi<0) throw new Error('header tidak ditemukan');
    const idx={}; grid[hi].forEach((h,i)=>idx[h.trim()]=i);
    if(idx['STNK a/n']==null||idx['Biro Jasa']==null) throw new Error('kolom tidak sesuai');
    const g=(r,n)=>idx[n]==null?'':(r[idx[n]]||'').trim();
    const rows=grid.slice(hi+1).map(r=>({no:g(r,'No'),nama:g(r,'STNK a/n'),type:g(r,'Type'),rangka:g(r,'NoRangka'),bast:g(r,'No. Bast'),polisi:g(r,'No Polisi').replace(/\s+/g,' '),
      mohon:nd(g(r,'Tgl Mohon STNK')),terima:nd(g(r,'Terima Tanggal STNK')),serah:nd(g(r,'Serah Tanggal STNK')),biro:g(r,'Biro Jasa'),leasing:g(r,'Leasing'),sales:g(r,'Salesman'),spv:g(r,'Supervisor'),ket:g(r,'Keterangan')}))
      .filter(r=>r.nama||r.rangka);
    let stamps={};
    if(b&&b.ok){ const t=await b.text(); const ps=/Per Salin\s*:\s*([^"\n\r]+)/.exec(t), pe=/Per Edit\s*:\s*([^"\n\r]+)/.exec(t); if(ps) stamps.perSalin=ps[1].trim(); if(pe) stamps.perEdit=pe[1].trim(); }
    return {rows,stamps};
  } finally { clearTimeout(to); }
}
async function loadAll(){
  if(state.loading) return; state.loading=true; renderHead();
  const res=await Promise.allSettled(SOURCES.map(fetchSource));
  const failed=[];
  res.forEach((r,i)=>{ const s=SOURCES[i];
    if(r.status==='fulfilled'){ s.rows=r.value.rows; s.loaded=true; if(r.value.stamps.perSalin) s.perSalin=r.value.stamps.perSalin; if(r.value.stamps.perEdit) s.perEdit=r.value.stamps.perEdit; }
    else failed.push(TABS[s.tab].title.split(' ')[0]+' '+s.cab); });
  state.failed=failed; if(failed.length<SOURCES.length){ state.lastSync=new Date(); state.everOk=true; } else state.lastSync=state.lastSync;
  state.loading=false; prep(); render();
}

/* ---------- filtering ---------- */
function filtered(exclude){
  const st=state[state.tab], q=st.f.q.trim().toLowerCase();
  return rowsOf(state.tab).filter(r=>{
    for(const k of ['cab','biro','leasing','spv','ket','age']){ if(k!==exclude && st.f[k] && fval(r,k)!==st.f[k]) return false; }
    if(q){ const hay=[r.nama,r.type,r.rangka,r.polisi,r.bast,r.sales,r.spv,r.biro,r.leasing,r.ket,r.cab].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function countBy(rows,k){ const m=new Map(); rows.forEach(r=>{const v=fval(r,k)||'(Kosong)'; m.set(v,(m.get(v)||0)+1);}); return m; }

/* ---------- render ---------- */
const SVG_REFRESH='<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';
function renderHead(){
  const tab=state.tab, cfg=TABS[tab], sel=state[tab].f.cab, srcs=SOURCES.filter(s=>s.tab===tab && (!sel||s.cab===sel));
  const stamps=srcs.map(s=>parseStamp(s.perSalin)).filter(Boolean); const latest=stamps.length? srcs.map(s=>s.perSalin).filter(Boolean).sort((a,b)=>parseStamp(a)-parseStamp(b)).pop() : null;
  $('per').textContent = latest? 'Per : '+latest : '';
  $('per').title = srcs.map(s=>`${s.cab}: Per Salin ${s.perSalin||'-'} · Per Edit ${s.perEdit||'-'}`).join('\n');
  const n=srcs.reduce((a,s)=>a+s.rows.length,0);
  $('src').textContent = `Sumber: ${cfg.sumber} ${srcs.map(s=>s.cab).join(', ')} (${n.toLocaleString('id-ID')} unit)`;
  const live=$('live'); const b=$('refresh');
  b.disabled=state.loading; b.classList.toggle('spin',state.loading);
  if(state.loading){ live.className='live'; live.innerHTML=`<span class="ico">${SVG_REFRESH}</span><span>Memuat data dari Google Sheet…</span>`; }
  else if(state.lastSync && !state.failed.length){ live.className='live'; live.innerHTML=`<span class="ico">${SVG_REFRESH}</span><span>Live · tersinkron <b>${fmtDT(state.lastSync)}</b> · otomatis tiap 2 menit</span>`; }
  else if(state.lastSync){ live.className='live warn'; live.innerHTML=`<span class="ico">${SVG_REFRESH}</span><span>Sebagian belum termuat (<b>${esc(state.failed.join(', '))}</b>) · terakhir tersinkron ${fmtDT(state.lastSync)}</span>`; }
  else { live.className='live warn'; live.innerHTML=`<span class="ico">${SVG_REFRESH}</span><span>Offline · memakai data salinan${latest?' per <b>'+esc(latest)+'</b>':''} · otomatis coba lagi tiap 2 menit</span>`; }
  for(const t of ['stnk','bpkb']){ $('tab-'+t).setAttribute('aria-selected',String(state.tab===t)); $('n-'+t).textContent=fmtN(rowsOf(t).length); }
}
function composition(k,title){
  const st=state[state.tab], sub=filtered(k), m=countBy(sub,k), tot=sub.length;
  const items=[...m.entries()].filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  if(!items.length) return '';
  const col=i=>i<CMP_COLORS.length?CMP_COLORS[i]:CMP_REST;
  const seg=items.map(([v,c],i)=>`<i style="flex:${c} 1 0;background:${col(i)}" title="${esc(v)}: ${c} unit (${fmtPct(c/tot*100)})"></i>`).join('');
  const lg=items.map(([v,c],i)=>`<button class="lc ${st.f[k]===v?'on':''}" data-k="${k}" data-v="${esc(v)}" title="${esc(v)}"><span class="d" style="background:${col(i)}"></span>${esc(v)} <b>${c.toLocaleString('id-ID')} unit</b> <span class="pc">(${fmtPct(c/tot*100)})</span></button>`).join('');
  return `<div class="cmp"><div class="ct">${title}</div><div class="stk">${seg}</div><div class="lg">${lg}</div></div>`;
}
function renderSummary(rows){
  const tab=state.tab, st=state[tab], ages=rows.map(r=>r.age).filter(a=>a!=null);
  const avg=ages.length? Math.round(ages.reduce((a,b)=>a+b,0)/ages.length):0, max=ages.length? Math.max(...ages):0;
  const ncab=new Set(rows.map(r=>r.cab)).size;
  const base=filtered('age'), m=countBy(base,'age'), tot=base.length;
  const hero=`<div class="hero"><div class="l">Total ${tab.toUpperCase()} belum siap — ${st.f.cab? esc(st.f.cab) : ncab+' cabang'}</div><div class="big">${rows.length? rows.length.toLocaleString('id-ID'):'-'}</div><div class="s">dari <b>${fmtN(rows.length)}</b> unit &nbsp;·&nbsp; rata-rata umur <b>${fmtN(avg)}</b> hari &nbsp;·&nbsp; terlama <b>${fmtN(max)}</b> hari</div>${ONLY||state[tab].f.cab? '' : composition('cab','Per Cabang')}${composition('biro','Per Biro Jasa')}${composition('leasing','Per Leasing')}</div>`;
  const tiles=BUCKETS.map((b,i)=>{ const c=m.get(b.k)||0, pct=tot? Math.round(c/tot*100):0;
    return `<button class="bt ${i===3?'crit':''} ${st.f.age===b.k?'on':''}" data-b="${b.k}"><div class="h"><span class="d" style="background:var(${b.dot})"></span>${b.l}</div><div class="v">${c? c.toLocaleString('id-ID')+' unit':'-'}</div><div class="c">${c? pct+'% dari total':'-'}${i===3&&c?' · prioritas tindak lanjut':''}</div></button>`; }).join('');
  $('sum').innerHTML = hero+`<div class="bk">${tiles}</div>`;
}
function renderCabTabs(){
  if(ONLY){ $('cabtabs').style.display='none'; return; }
  const tab=state.tab, sel=state[tab].f.cab, all=rowsOf(tab);
  const pill=(v,label,n)=>`<button class="pill" role="tab" data-c="${esc(v)}" aria-selected="${sel===v}">${esc(label)} <span class="n">${fmtN(n)}</span></button>`;
  $('cabtabs').innerHTML = pill('','Semua Cabang',all.length)+CABTAB.map(c=>pill(c,c,all.filter(r=>r.cab===c).length)).join('');
}
function renderFilters(){
  const st=state[state.tab], all=rowsOf(state.tab);
  const opts=k=>{ if(k==='age') return BUCKETS.map(b=>[b.k,b.l]); if(k==='cab') return CABS.map(c=>[c,c]); const s=[...new Set(all.map(r=>fval(r,k)||'(Kosong)'))].sort((a,b)=>a.localeCompare(b)); return s.map(v=>[v,v]); };
  const active=document.activeElement && document.activeElement.id==='q';
  $('filters').innerHTML = `<input id="q" type="search" placeholder="Cari nama, no polisi, no rangka, salesman..." value="${esc(st.f.q)}">`+
    FILTERS.map(([k,lab])=>`<select data-f="${k}"><option value="">${lab}</option>${opts(k).map(([v,l])=>`<option value="${esc(v)}" ${st.f[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`).join('')+
    `<button class="btn" id="reset">Reset</button><span class="spacer"></span><button class="btn pri" id="xls">Export Excel</button><button class="btn" id="pdf">Export PDF</button>`;
  if(active){ const q=$('q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
}
function sortedRows(rows){
  const st=state[state.tab], {key,dir}=st.sort;
  const num = key==='age'||key==='no', dateKey=['mohon','terima','serah'].includes(key);
  const val = r => num? (r[key]===null||r[key]===''?-1:+r[key]) : dateKey? (pd(r[key])?.getTime()??0) : String(r[key]??'').toLowerCase();
  return rows.slice().sort((a,b)=>{ const x=val(a),y=val(b); return (x<y?-1:x>y?1:0)*dir; });
}
function cell(r,key,cls){
  let v=r[key];
  if(key==='age'){ if(v==null) return `<td class="num"><span class="dash">-</span></td>`; return `<td class="num"><span class="badge ${bucketOf(v).c}">${fmtN(v)}</span></td>`; }
  if(key==='no') v=r._n;
  if(v===''||v==null) return `<td class="${cls||''}"><span class="dash">-</span></td>`;
  return `<td class="${cls||''}">${esc(v)}</td>`;
}
function renderTable(rows){
  const cfg=TABS[state.tab], st=state[state.tab];
  const head='<thead><tr>'+cfg.cols.map(([k,l,c])=>`<th class="${c==='num'?'num':''}" data-s="${k}">${esc(l)}${st.sort.key===k?`<span class="ar">${st.sort.dir>0?'▲':'▼'}</span>`:''}</th>`).join('')+'</tr></thead>';
  const srt=sortedRows(rows); srt.forEach((r,i)=>r._n=i+1);
  const body = srt.length? srt.map(r=>'<tr>'+cfg.cols.map(([k,,c])=>cell(r,k,c)).join('')+'</tr>').join('') : `<tr><td colspan="${cfg.cols.length}" class="empty">Tidak ada data yang sesuai filter</td></tr>`;
  $('tbl').innerHTML=head+'<tbody>'+body+'</tbody>';
  $('cnt').textContent=`Menampilkan ${fmtN(rows.length)} dari ${fmtN(rowsOf(state.tab).length)} unit`;
}
function exportRows(){
  const cfg=TABS[state.tab]; const rows=sortedRows(filtered()); rows.forEach((r,i)=>r._n=i+1);
  return {heads:cfg.cols.map(c=>c[1]), data:rows.map(r=>cfg.cols.map(([k])=>{ const v=k==='no'?r._n:r[k]; return (v===null||v===undefined)?'':(k==='age'||k==='no')&&v!==''?+v:v; }))};
}
function downloadBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function exportExcel(){
  const {heads,data}=exportRows(); const stamp=TODAY.toISOString().slice(0,10); const name=`${TABS[state.tab].title.replace(/ /g,'_')}_Semua_Cabang_${stamp}`;
  const csvFallback=()=>{ const q=v=>`"${String(v).replace(/"/g,'""')}"`; downloadBlob(new Blob(['﻿'+[heads,...data].map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),name+'.csv'); };
  const go=()=>{ try{ const ws=XLSX.utils.aoa_to_sheet([heads,...data]); ws['!cols']=heads.map((h,i)=>({wch:Math.min(40,Math.max(h.length,...data.map(r=>String(r[i]).length))+2)})); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,TABS[state.tab].title.slice(0,31)); XLSX.writeFile(wb,name+'.xlsx'); }catch(e){ csvFallback(); } };
  if(window.XLSX) return go();
  const s=document.createElement('script'); s.src='https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js'; s.onload=go; s.onerror=csvFallback; document.head.appendChild(s);
}
function render(){
  renderHead(); const rows=filtered(); renderCabTabs(); renderSummary(rows); renderFilters(); renderTable(rows);
}
document.addEventListener('click',e=>{
  const st=state[state.tab];
  const tb=e.target.closest('.tab'); if(tb){ state.tab=tb.id.replace('tab-',''); render(); return; }
  const pl=e.target.closest('.pill'); if(pl){ st.f.cab=pl.dataset.c; render(); return; }
  const bt=e.target.closest('.bt'); if(bt){ const v=bt.dataset.b; st.f.age=st.f.age===v?'':v; render(); return; }
  const lc=e.target.closest('.lc'); if(lc){ const k=lc.dataset.k, v=lc.dataset.v; st.f[k]=st.f[k]===v?'':v; render(); return; }
  const th=e.target.closest('th[data-s]'); if(th){ const k=th.dataset.s; st.sort = st.sort.key===k? {key:k,dir:-st.sort.dir}:{key:k,dir:(k==='age'?-1:1)}; renderTable(filtered()); return; }
  if(e.target.closest('#refresh')) { loadAll(); return; }
  if(e.target.id==='reset'){ const c=st.f.cab; st.f=emptyF(); st.f.cab=c; render(); }
  if(e.target.id==='xls') exportExcel();
  if(e.target.id==='pdf') window.print();
});
document.addEventListener('change',e=>{ if(e.target.dataset.f){ state[state.tab].f[e.target.dataset.f]=e.target.value; render(); } });
document.addEventListener('input',e=>{ if(e.target.id==='q'){ state[state.tab].f.q=e.target.value; const rows=filtered(); renderSummary(rows); renderTable(rows); } });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && (!state.lastSync || Date.now()-state.lastSync>REFRESH_MS)) loadAll(); });

function startApp(){
  prep(); render();
  loadAll();
  setInterval(()=>{ if(!document.hidden) loadAll(); }, REFRESH_MS);
}

const h53 = (str) => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); };

function validName(v){
  v = (v || '').trim();
  if (!/^[A-Za-z.' -]+$/.test(v)) return false;
  const words = v.split(/\s+/).filter(Boolean);
  if (words.length < 2) return false;
  const lower = v.toLowerCase();
  for (let i = 0; i < NAMA_KATA_TERLARANG.length; i++){
    if (lower.indexOf(NAMA_KATA_TERLARANG[i]) >= 0) return false;
  }
  return true;
}
